name = "apt-note-tg-bot"
main = "src/index.ts"
compatibility_date = "2026-04-21"
workers_dev = true

[vars]
GITHUB_REPO = "zeros1205/KR_APT_DOC_READER"

# [운영 종료 2026-09-03] Worker 자체 cron 제거.
# 이 crons 가 하루 3회 scheduled() 를 깨워 GitHub API 로
# codex-collect-notices.yml 을 workflow_dispatch 했다. 워크플로 YAML 에서
# schedule: 을 지워도 이 경로는 살아 있었다.
# 주의: 이 파일 수정만으로는 "이미 배포된" Worker 가 멈추지 않는다.
# Cloudflare 대시보드에서 Worker(apt-note-tg-bot) 를 삭제해야 실제로 멈춘다.

# DEVICES_KV: 푸시 토큰·관심지역·발송이력 저장
# Cloudflare Dashboard → Workers & Pages → KV 에서 생성한 namespace.
[[kv_namespaces]]
binding = "DEVICES_KV"
id = "0c75f73ec8754e00a122ec209b992104"
preview_id = "0c75f73ec8754e00a122ec209b992104"

# 시크릿: `wrangler secret put <NAME>` 으로 등록
#   DISPATCH_TOKEN           — GitHub Actions → Worker 인증 토큰
#   FCM_PROJECT_ID           — Firebase 프로젝트 ID
#   FCM_SERVICE_ACCOUNT_JSON — 서비스 계정 키 JSON 전문
