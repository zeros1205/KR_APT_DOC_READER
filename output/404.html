<!DOCTYPE html>
<html lang="ko" data-palette="A">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-adsense-account" content="ca-pub-8234120897033274">
<title>페이지를 찾을 수 없습니다 - 정과장의 청약노트</title>
<meta name="description" content="요청하신 페이지를 찾을 수 없습니다. 정과장의 청약노트 홈에서 최신 분양 정보를 확인하세요.">
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/x-icon" href="https://apt-note.com/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="https://apt-note.com/favicon-32x32.png">
<link rel="apple-touch-icon" href="https://apt-note.com/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --c-primary: #d97757;
  --c-primary-dark: #b85c38;
  --c-bg: #fffaf3;
  --c-surface: #ffffff;
  --c-dark: #2c2925;
  --c-mid: #767370;
  --c-light-gray: #e8e6dc;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  background: var(--c-bg);
  color: var(--c-dark);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
}
.card {
  max-width: 520px;
  width: 100%;
  background: var(--c-surface);
  border: 1px solid var(--c-light-gray);
  border-radius: 16px;
  padding: 40px 32px;
  text-align: center;
  box-shadow: 0 6px 24px rgba(44, 41, 37, 0.05);
}
.code {
  font-size: 3.5rem;
  font-weight: 800;
  color: var(--c-primary);
  line-height: 1;
  letter-spacing: -0.04em;
  margin: 0 0 12px;
}
.title {
  font-size: 1.375rem;
  font-weight: 700;
  margin: 0 0 12px;
  letter-spacing: -0.02em;
}
.desc {
  font-size: 0.9375rem;
  color: var(--c-mid);
  line-height: 1.6;
  margin: 0 0 28px;
}
.btn {
  display: inline-block;
  background: var(--c-primary);
  color: #fff;
  font-size: 0.9375rem;
  font-weight: 700;
  padding: 14px 28px;
  border-radius: 10px;
  text-decoration: none;
  min-height: 44px;
  min-width: 160px;
  line-height: 1.2;
  transition: background 200ms ease;
}
.btn:hover, .btn:focus {
  background: var(--c-primary-dark);
  outline-offset: 3px;
}
.footer {
  text-align: center;
  font-size: 0.75rem;
  color: var(--c-mid);
  padding: 24px;
}
.footer a {
  color: var(--c-mid);
  text-decoration: underline;
}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <p class="code">404</p>
    <h1 class="title">페이지를 찾을 수 없어요</h1>
    <p class="desc">
      요청하신 주소가 변경되었거나 더 이상 제공되지 않는 페이지입니다.<br>
      홈에서 최신 분양 정보를 확인해 주세요.
    </p>
    <a class="btn" href="/">홈으로 돌아가기</a>
  </div>
</main>
<footer class="footer">
  <a href="/">정과장의 청약노트</a>
</footer>
</body>
</html>
