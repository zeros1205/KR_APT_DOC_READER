name: FCM 푸시 알림 발송

# [운영 종료 2026-09-01] 자동 트리거 제거 — 수동 실행(workflow_dispatch)만 남김.
# 되살리려면 이 커밋을 revert 하면 원래 트리거가 복구된다.
on:
  workflow_dispatch:
    inputs:
      window:
        description: "발송 윈도우"
        required: true
        type: choice
        default: "morning"
        options:
          - "morning"
          - "afternoon"
      date:
        description: "기준일 YYYY-MM-DD (KST). 비우면 오늘"
        required: false
        default: ""
      dry_run:
        description: "true면 FCM 발송 없이 plan만 응답"
        required: false
        type: choice
        default: "false"
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine window
        id: window
        run: |
          CRON="${{ github.event.schedule }}"
          INPUT_WIN="${{ github.event.inputs.window }}"
          if [ -n "$INPUT_WIN" ]; then
            WIN="$INPUT_WIN"
          elif [ "$CRON" = "0 1 * * *" ]; then
            WIN="morning"
          elif [ "$CRON" = "0 8 * * *" ]; then
            WIN="afternoon"
          else
            WIN="morning"
          fi
          echo "window=$WIN" >> "$GITHUB_OUTPUT"
          echo "Selected window: $WIN"

      - name: Build payload
        id: build
        run: |
          set -euo pipefail
          WINDOW="${{ steps.window.outputs.window }}"
          DATE_INPUT="${{ github.event.inputs.date }}"
          ARGS=(--window "$WINDOW")
          if [ -n "$DATE_INPUT" ]; then
            ARGS+=(--date "$DATE_INPUT")
          fi
          python scripts/build_push_payload.py "${ARGS[@]}" > payload.json
          COUNT="$(python -c 'import json,sys; print(len(json.load(open("payload.json"))["posts"]))')"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Payload posts: $COUNT"

      - name: Skip when no posts
        if: steps.build.outputs.count == '0'
        run: echo "윈도우 안에 신규 포스트가 없습니다. 발송을 건너뜁니다."

      - name: Inject dry_run flag
        if: steps.build.outputs.count != '0' && github.event.inputs.dry_run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("payload.json")
          data = json.loads(p.read_text())
          data["dry_run"] = True
          p.write_text(json.dumps(data, ensure_ascii=False))
          PY

      - name: Dispatch to Cloudflare Worker
        if: steps.build.outputs.count != '0'
        env:
          WORKER_ORIGIN: ${{ secrets.WORKER_ORIGIN }}
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WORKER_ORIGIN:-}" ] || [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::error::WORKER_ORIGIN 또는 DISPATCH_TOKEN 시크릿이 설정되지 않았습니다."
            exit 1
          fi
          HTTP_STATUS="$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "${WORKER_ORIGIN}/push/dispatch" \
            -H "Content-Type: application/json" \
            -H "X-Dispatch-Token: ${DISPATCH_TOKEN}" \
            --data @payload.json)"
          echo "HTTP $HTTP_STATUS"
          cat response.json
          echo
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Worker dispatch 실패 (status $HTTP_STATUS)"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: push-notifications-${{ steps.window.outputs.window }}-${{ github.run_id }}
          path: |
            payload.json
            response.json
          if-no-files-found: ignore
          retention-days: 7
