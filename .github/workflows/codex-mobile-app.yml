name: Build Mobile App (Android)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile-app/**"
      - ".github/workflows/codex-mobile-app.yml"
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - ".github/workflows/codex-mobile-app.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mobile-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build web shell
        working-directory: mobile-app
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: mobile-app
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x mobile-app/android/gradlew

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > mobile-app/android/aptnote-release.jks

      - name: Check keystore and env
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -e
          echo "KEYSTORE_PATH: $KEYSTORE_PATH"
          ls -la mobile-app/android/aptnote-release.jks || true
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/mobile-app/android/aptnote-release.jks

      - name: Build Android release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: mobile-app/android
        run: ./gradlew clean assembleRelease bundleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/mobile-app/android/aptnote-release.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: List build outputs
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "APK outputs:"
          ls -la mobile-app/android/app/build/outputs/apk/release || true
          echo "AAB outputs (bundle):"
          ls -la mobile-app/android/app/build/outputs/bundle/release || true

      - name: Verify release APK signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -e
          APK_PATH="mobile-app/android/app/build/outputs/apk/release/app-release.apk"
          SDK_BT_DIR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH" >&2
            exit 1
          fi

          echo "Verifying APK signature..."
          "$SDK_BT_DIR/apksigner" verify --verbose --print-certs "$APK_PATH"
          echo "✓ APK is properly signed"

      - name: Prepare APK artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          APK_RELEASE="mobile-app/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_RELEASE" ]; then
            echo "ERROR: Signed APK not found at $APK_RELEASE" >&2
            exit 1
          fi
          cp "$APK_RELEASE" artifact-app-release.apk
          echo "✓ Signed APK ready for upload"

      - name: Build Android debug APK (서명 시크릿 없을 때 검증용)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload release AAB artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aptnote-release-${{ github.run_number }}.aab
          path: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload release APK artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aptnote-release-${{ github.run_number }}.apk
          path: artifact-app-release.apk
          retention-days: 30
