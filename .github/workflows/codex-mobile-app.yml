name: Build Mobile App (Android)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile-app/**"
      - ".github/workflows/codex-mobile-app.yml"
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - ".github/workflows/codex-mobile-app.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mobile-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build web shell
        working-directory: mobile-app
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: mobile-app
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x mobile-app/android/gradlew

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 }}
        run: |
          echo "${{ env.KEYSTORE_BASE64 }}" | base64 --decode > mobile-app/android/aptnote-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Android release AAB
        if: ${{ env.KEYSTORE_BASE64 }}
        working-directory: mobile-app/android
        run: ./gradlew bundleRelease assembleRelease --no-daemon
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/mobile-app/android/aptnote-release.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Build Android debug APK (서명 시크릿 없을 때 검증용)
        if: ${{ !env.KEYSTORE_BASE64 }}
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Upload release AAB artifact
        if: ${{ env.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        with:
          name: aptnote-release-${{ github.run_number }}.aab
          path: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload release APK artifact
        if: ${{ env.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        with:
          name: aptnote-release-${{ github.run_number }}.apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
