name: Build Mobile App (Android)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile-app/**"
      - ".github/workflows/codex-mobile-app.yml"
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - ".github/workflows/codex-mobile-app.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mobile-app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build web shell
        working-directory: mobile-app
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: mobile-app
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x mobile-app/android/gradlew

      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > mobile-app/android/aptnote-release.jks

      - name: Check keystore and env
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -e
          echo "KEYSTORE_PATH: $KEYSTORE_PATH"
          ls -la mobile-app/android/aptnote-release.jks || true
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/mobile-app/android/aptnote-release.jks

      - name: Build Android release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: mobile-app/android
        run: ./gradlew clean assembleRelease bundleRelease --no-daemon
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/mobile-app/android/aptnote-release.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: List build outputs
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "APK outputs:"
          ls -la mobile-app/android/app/build/outputs/apk/release || true
          echo "AAB outputs (bundle):"
          ls -la mobile-app/android/app/build/outputs/bundle/release || true

      - name: Sign APK if needed (zipalign + apksigner)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -e
          APK_SIGNED_PATH="mobile-app/android/app/build/outputs/apk/release/app-release.apk"
          APK_UNSIGNED_PATH="mobile-app/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT_ALIGNED="artifact-app-release-aligned.apk"
          OUT_SIGNED="artifact-app-release.apk"

          # Find latest build-tools for zipalign & apksigner
          SDK_BT_DIR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $SDK_BT_DIR"

          if [ -f "$APK_SIGNED_PATH" ]; then
            echo "Found signed APK → copying to $OUT_SIGNED"
            cp "$APK_SIGNED_PATH" "$OUT_SIGNED"
          elif [ -f "$APK_UNSIGNED_PATH" ]; then
            echo "Found unsigned APK → zipalign and sign"
            "$SDK_BT_DIR/zipalign" -p -f 4 "$APK_UNSIGNED_PATH" "$OUT_ALIGNED"
            "$SDK_BT_DIR/apksigner" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$KEYSTORE_KEY_ALIAS" \
              --ks-pass pass:"$KEYSTORE_STORE_PASSWORD" \
              --key-pass pass:"$KEYSTORE_KEY_PASSWORD" \
              --out "$OUT_SIGNED" \
              "$OUT_ALIGNED"
            echo "Verifying signed APK"
            "$SDK_BT_DIR/apksigner" verify --verbose --print-certs "$OUT_SIGNED"
          else
            echo "No APK found to sign" >&2
            exit 1
          fi
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/mobile-app/android/aptnote-release.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Prepare APK artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          APK_SIGNED="mobile-app/android/app/build/outputs/apk/release/app-release.apk"
          APK_UNSIGNED="mobile-app/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "$APK_SIGNED" ]; then
            cp "$APK_SIGNED" artifact-app-release.apk
            echo "Copied signed APK to artifact-app-release.apk"
          elif [ -f "$APK_UNSIGNED" ]; then
            cp "$APK_UNSIGNED" artifact-app-release.apk
            echo "Copied unsigned APK to artifact-app-release.apk"
          else
            echo "No APK found to artifact" >&2
            exit 1
          fi

      - name: Build Android debug APK (서명 시크릿 없을 때 검증용)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload release AAB artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aptnote-release-${{ github.run_number }}.aab
          path: mobile-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload release APK artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: aptnote-release-${{ github.run_number }}.apk
          path: artifact-app-release.apk
          retention-days: 30
