name: 분양가·일정 감사

on:
  workflow_run:
    workflows: [청약 공고 자동 수집 및 포스팅 생성]
    types: [completed]

jobs:
  check-post-count:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 포스팅 개수 확인 (5개 배수일 때만 실행)
        id: check
        run: |
          POST_COUNT=$(find output/posts -maxdepth 1 -type d ! -name 'posts' | wc -l)
          echo "post_count=$POST_COUNT" >> $GITHUB_OUTPUT
          if [ $((POST_COUNT % 5)) -eq 0 ] && [ $POST_COUNT -gt 0 ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "✓ 포스팅 개수: $POST_COUNT개 (5개 배수) → 감사 실행"
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "⊘ 포스팅 개수: $POST_COUNT개 → 감사 스킵"
          fi

  audit:
    needs: check-post-count
    if: needs.check-post-count.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install httpx python-dotenv

      - name: Run price audit with API validation
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: python3 audit_prices_with_api.py

      - name: Upload results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: output/price_audit_results.json

      - name: Summary
        if: success()
        run: |
          echo "## 📊 분양가·일정 감사 완료" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          with open('output/price_audit_results.json') as f:
            data = json.load(f)
          print(f'✓ 검사 포스트: {data[\"total\"]}개')
          print(f'📊 상태: {data[\"status\"]}')
          " >> $GITHUB_STEP_SUMMARY
