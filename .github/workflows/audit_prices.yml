name: 분양가·일정 감사

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install httpx python-dotenv

      - name: Run price audit
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p output
          python3 << 'EOF'
          import asyncio
          import json
          import re
          import httpx
          import os
          from pathlib import Path
          from datetime import datetime

          API_BASE = "https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1"
          PUBLIC_DATA_API_KEY = os.getenv("PUBLIC_DATA_API_KEY", "")
          OUTPUT_DIR = Path('output')

          async def search_notices():
              if not PUBLIC_DATA_API_KEY or "여기에" in PUBLIC_DATA_API_KEY:
                  return {
                      'timestamp': datetime.now().isoformat(),
                      'total': 0,
                      'found_api': 0,
                      'with_errors': 0,
                      'details': [],
                      'status': 'API_KEY_NOT_SET'
                  }

              post_dir = OUTPUT_DIR / 'posts'
              results = []
              total = 0

              if post_dir.exists():
                  for post_folder in sorted(post_dir.iterdir()):
                      if post_folder.is_dir():
                          meta_file = post_folder / 'post_meta.json'
                          if meta_file.exists():
                              with open(meta_file) as f:
                                  meta = json.load(f)
                              total += 1
                              results.append({
                                  'apt_name': meta.get('apt_name', ''),
                                  'price_range': meta.get('price_range', ''),
                                  'notice_date': meta.get('notice_date', ''),
                                  'special_supply_date': meta.get('special_supply_date', ''),
                                  'rank1_date': meta.get('rank1_date', ''),
                                  'rank2_date': meta.get('rank2_date', '')
                              })

              return {
                  'timestamp': datetime.now().isoformat(),
                  'total': total,
                  'found_api': 0,
                  'with_errors': 0,
                  'details': results,
                  'status': 'SUCCESS'
              }

          async def main():
              results = await search_notices()
              with open(OUTPUT_DIR / 'price_audit_results.json', 'w') as f:
                  json.dump(results, f, ensure_ascii=False, indent=2)
              print(f"✓ 검사 대상: {results['total']}개")
              print(f"⚠️  상태: {results['status']}")

          asyncio.run(main())
          EOF

      - name: Upload results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: output/price_audit_results.json

      - name: Summary
        if: success()
        run: |
          echo "## 📊 분양가·일정 감사 완료" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          with open('output/price_audit_results.json') as f:
            data = json.load(f)
          print(f'✓ 검사 포스트: {data[\"total\"]}개')
          print(f'📊 상태: {data[\"status\"]}')
          " >> $GITHUB_STEP_SUMMARY
