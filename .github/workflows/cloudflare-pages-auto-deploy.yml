name: Cloudflare Pages 자동 배포

# output/ 파일이 main 에 커밋될 때마다 자동 실행.
# 커버 범위:
#   - codex-collect-notices.yml 의 posts_index 갱신 커밋 (하루 3회)
#   - post.html 직접 패치 커밋 (그레이 헤더 일괄패치, v3 즉시복원 등)
#   - 기타 output/ 변경이 포함된 모든 main 머지
#
# codex-generate-pages.yml 은 수동 실행 후 자체 deploy 스텝이 있지만,
# 이 워크플로우는 수동 실행 없이 발생하는 모든 output/ 변경을 커버한다.
# 같은 concurrency 그룹으로 동시 배포 충돌 방지.

on:
  push:
    branches:
      - main
    paths:
      - "output/**"

concurrency:
  # codex-generate-pages.yml 의 deploy 스텝과 동일 그룹.
  # cancel-in-progress: true → 가장 최신 커밋만 배포되도록 이전 실행 취소.
  group: cloudflare-pages-deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        # wrangler-action@v3 대신 npm 직접 설치:
        #   - Node.js 버전 강제(FORCE_JAVASCRIPT_ACTIONS_TO_NODE24) 영향 없음
        #   - 항상 최신 wrangler@4.x 사용 (API 호환성 보장)
        #   - --branch main: production 배포 명시
        #   - --commit-dirty=true: git 워킹 트리 uncommitted 경고 억제
        run: |
          npm install -g wrangler
          wrangler pages deploy output \
            --project-name kr-apt-doc-reader \
            --branch main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify Telegram on deploy
        if: always()
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured. Skipping."
            exit 0
          fi

          KST_TIME="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          JOB_STATUS="${{ job.status }}"
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          SHORT_MSG="$(echo "$COMMIT_MSG" | head -1 | cut -c1-60)"

          if [ "$JOB_STATUS" = "success" ]; then
            ICON="🚀"
          else
            ICON="❌"
          fi

          MESSAGE="${ICON} Cloudflare Pages 자동 배포 ${JOB_STATUS} (${KST_TIME})

커밋: ${SHORT_MSG}
실행 로그: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            > /dev/null
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
