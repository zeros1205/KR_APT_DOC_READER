name: Cloudflare Pages 자동 배포

# output/ 파일이 main 에 커밋될 때마다 자동 실행.
# 커버 범위:
#   - codex-collect-notices.yml 의 posts_index 갱신 커밋 (하루 3회)
#   - post.html 직접 패치 커밋 (그레이 헤더 일괄패치, v3 즉시복원 등)
#   - 기타 output/ 변경이 포함된 모든 main 머지
#
# codex-generate-pages.yml 은 수동 실행 후 자체 deploy 스텝이 있지만,
# 이 워크플로우는 수동 실행 없이 발생하는 모든 output/ 변경을 커버한다.
# 같은 concurrency 그룹으로 동시 배포 충돌 방지.

on:
  push:
    branches:
      - main
    paths:
      - "output/**"
  # 수동 실행 — 봇 커밋(GITHUB_TOKEN push)은 다른 워크플로우를 트리거하지 않으므로,
  # app-version.json 발행 등으로 밀린 배포를 즉시 반영할 수 있는 탈출구.
  workflow_dispatch:
  # 안전망 — push 트리거가 누락돼도 하루 1회 최신 output/ 을 배포(매일 KST 09:20).
  schedule:
    - cron: "20 0 * * *"

concurrency:
  # codex-generate-pages.yml 의 deploy 스텝과 동일 그룹.
  # cancel-in-progress: true → 가장 최신 커밋만 배포되도록 이전 실행 취소.
  group: cloudflare-pages-deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        # npx 로 wrangler@3.90.0 직접 실행 — GitHub Actions 에서 검증된 방식.
        # (npm install -g 는 ubuntu 러너에서 PATH 미반영 문제가 있고,
        #  wrangler@4.x 는 v3 대비 동작 변경으로 실패 가능성 있어 v3.90.0 고정)
        run: |
          npx --yes wrangler@3.90.0 pages deploy output \
            --project-name kr-apt-doc-reader \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify Telegram on deploy failure
        # 배포 실패 시에만 알림. 성공 배포는 조용히 넘어간다.
        if: failure()
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured. Skipping."
            exit 0
          fi

          KST_TIME="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          # head_commit 은 push 에만 존재. 수동/스케줄 실행은 트리거명으로 대체.
          # 셸 인젝션·따옴표 깨짐 방지를 위해 env 로 안전하게 주입 후 가공.
          SHORT_MSG="$(printf '%s' "$RAW_COMMIT_MSG" | head -1 | cut -c1-60)"
          if [ -z "$SHORT_MSG" ]; then SHORT_MSG="${GITHUB_EVENT_NAME} 배포"; fi
          MSG="❌ Cloudflare Pages 배포 실패 (${KST_TIME}) | ${SHORT_MSG} | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
