name: Publish Mobile App Version

# Updates output/app-version.json so the running app's "최신 버전" reflects
# what users can actually install.
#
#   - auto (default): query Play / App Store Connect, take whatever version
#     is currently live, write that into app-version.json. No manual input
#     of version numbers — the store is the source of truth.
#   - manual: skip API checks and commit the supplied version immediately,
#     an escape hatch for edge cases (e.g. API outage, intentional rollback
#     to a previously-pulled version).
#
# This workflow is the ONLY thing that should update output/app-version.json.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform field(s) to update."
        required: true
        type: choice
        options:
          - ios
          - android
          - both
      mode:
        description: "auto = read the currently live version from the store. manual = use the explicit version inputs below."
        required: true
        type: choice
        default: auto
        options:
          - auto
          - manual
      ios_version_name:
        description: "Manual mode only — iOS versionName to publish (e.g. 1.0.5)."
        required: false
        default: ""
      android_version_name:
        description: "Manual mode only — Android versionName to publish (e.g. 0.2.1)."
        required: false
        default: ""

concurrency:
  group: mobile-app-publish-version
  cancel-in-progress: false

jobs:
  publish:
    name: Publish app-version.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate manual inputs
        if: ${{ inputs.mode == 'manual' }}
        env:
          PLATFORM: ${{ inputs.platform }}
          IOS_VERSION: ${{ inputs.ios_version_name }}
          ANDROID_VERSION: ${{ inputs.android_version_name }}
        run: |
          set -euo pipefail
          if [ "$PLATFORM" = "ios" ] || [ "$PLATFORM" = "both" ]; then
            if [ -z "$IOS_VERSION" ]; then
              echo "manual mode: ios_version_name required when platform=$PLATFORM" >&2
              exit 1
            fi
          fi
          if [ "$PLATFORM" = "android" ] || [ "$PLATFORM" = "both" ]; then
            if [ -z "$ANDROID_VERSION" ]; then
              echo "manual mode: android_version_name required when platform=$PLATFORM" >&2
              exit 1
            fi
          fi
          for v in "$IOS_VERSION" "$ANDROID_VERSION"; do
            if [ -n "$v" ] && ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "version '$v' must match MAJOR.MINOR.PATCH (e.g. 1.0.5)" >&2
              exit 1
            fi
          done

      - name: Set up Python
        if: ${{ inputs.mode == 'auto' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        if: ${{ inputs.mode == 'auto' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "pyjwt[crypto]==2.9.0" google-api-python-client==2.151.0 google-auth==2.35.0

      - name: Detect live versions
        if: ${{ inputs.mode == 'auto' }}
        id: detect
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -uo pipefail
          ios_version=""
          android_version=""

          # Run the check, ALWAYS print stdout, then branch on exit code.
          # With `set -e` + `out=$(...)`, a non-zero exit would abort the
          # script before we could echo the reason — exactly what hid the
          # last failure. Using `&& rc=0 || rc=$?` keeps -e happy and
          # captures the real code.
          check() {
            local platform="$1" varname="$2"
            local out rc
            out="$(python scripts/check_store_version.py --platform "$platform")" && rc=0 || rc=$?
            echo "::group::$platform"
            echo "$out"
            echo "::endgroup::"
            case "$rc" in
              0)  printf -v "$varname" '%s' "$(printf '%s' "$out" | jq -r '.version // ""')" ;;
              2)  echo "no live $platform version (still in review / staged rollout / no release)" >&2; exit 2 ;;
              *)  echo "$platform check failed (exit $rc) — see reason above" >&2; exit 1 ;;
            esac
          }

          if [ "$PLATFORM" = "ios" ] || [ "$PLATFORM" = "both" ]; then
            check ios ios_version
          fi
          if [ "$PLATFORM" = "android" ] || [ "$PLATFORM" = "both" ]; then
            check android android_version
          fi

          echo "ios_version=$ios_version" >> "$GITHUB_OUTPUT"
          echo "android_version=$android_version" >> "$GITHUB_OUTPUT"

      - name: Patch output/app-version.json
        env:
          PLATFORM: ${{ inputs.platform }}
          IOS_VERSION: ${{ inputs.mode == 'auto' && steps.detect.outputs.ios_version || inputs.ios_version_name }}
          ANDROID_VERSION: ${{ inputs.mode == 'auto' && steps.detect.outputs.android_version || inputs.android_version_name }}
        run: |
          set -euo pipefail
          mkdir -p output
          if [ ! -s output/app-version.json ]; then
            echo '{}' > output/app-version.json
          fi
          tmp="$(mktemp)"
          jq \
            --arg plat "$PLATFORM" \
            --arg ios "$IOS_VERSION" \
            --arg and "$ANDROID_VERSION" \
            'if $plat == "ios" or $plat == "both" then .ios = $ios else . end
             | if $plat == "android" or $plat == "both" then .android = $and else . end' \
            output/app-version.json > "$tmp"
          mv "$tmp" output/app-version.json
          echo "--- output/app-version.json ---"
          cat output/app-version.json

      - name: Commit and push
        id: commit
        env:
          PLATFORM: ${{ inputs.platform }}
          MODE: ${{ inputs.mode }}
          IOS_VERSION: ${{ inputs.mode == 'auto' && steps.detect.outputs.ios_version || inputs.ios_version_name }}
          ANDROID_VERSION: ${{ inputs.mode == 'auto' && steps.detect.outputs.android_version || inputs.android_version_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- output/app-version.json; then
            echo "app-version.json already matches store; no commit needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/app-version.json

          msg="chore(mobile): publish app-version.json"
          case "$PLATFORM" in
            ios)     msg="$msg ios=$IOS_VERSION" ;;
            android) msg="$msg android=$ANDROID_VERSION" ;;
            both)    msg="$msg ios=$IOS_VERSION android=$ANDROID_VERSION" ;;
          esac
          if [ "$MODE" = "manual" ]; then
            msg="$msg [manual]"
          fi
          git commit -m "$msg"
          pushed=false
          n=0
          until [ "$n" -ge 4 ]; do
            if git push origin HEAD:main; then pushed=true; break; fi
            n=$((n+1))
            sleep $(( 2 ** n ))
          done
          if [ "$pushed" != true ]; then
            echo "git push failed after retries" >&2
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 봇(GITHUB_TOKEN) 커밋은 cloudflare-pages-auto-deploy 의 push 트리거를 발동시키지
      # 않으므로, 여기서 직접 배포해 발행 즉시 라이브에 반영한다(별도 수동 배포 불필요).
      # app-version.json 이 실제로 바뀐 경우에만 실행.
      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        run: |
          npx --yes wrangler@3.90.0 pages deploy output \
            --project-name kr-apt-doc-reader \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

