name: 청약홈 상세페이지 URL 추출

on:
  workflow_dispatch:
    inputs:
      days:
        description: '최근 N일 공고 수집'
        required: false
        default: '7'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export-notice-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: .env 파일 생성 (GitHub Secrets → .env)
        run: |
          cat <<EOF > .env
          PUBLIC_DATA_API_KEY=${{ secrets.PUBLIC_DATA_API_KEY }}
          ENABLE_NOTICE_PDF=false
          EOF

      - name: 상세페이지 URL 추출
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          python export_notice_urls.py --days "$DAYS" | tee export.log

      - name: 실행 결과 요약
        if: always()
        run: |
          echo '## 청약홈 상세페이지 URL 추출 결과' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f export.log ]; then
            tail -n 200 export.log >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- 생성 파일:' >> "$GITHUB_STEP_SUMMARY"
          ls -l output/notice_urls.* >> "$GITHUB_STEP_SUMMARY" || true

      - name: 결과 파일 업로드
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notice-urls-${{ github.run_id }}
          path: |
            output/notice_urls.csv
            output/notice_urls.md
            export.log
          retention-days: 7
          if-no-files-found: ignore
