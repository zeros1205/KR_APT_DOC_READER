name: codex-청약홈 링크 목록 만들기

on:
  workflow_dispatch:
    inputs:
      include_processed:
        description: "이미 생성된 공고 포함 여부"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      include_with_pdf:
        description: "이미 PDF가 있는 공고 포함 여부"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  export-notice-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export cached notice URLs
        run: |
          INCLUDE_PROCESSED="${{ github.event.inputs.include_processed || 'false' }}"
          INCLUDE_WITH_PDF="${{ github.event.inputs.include_with_pdf || 'false' }}"

          CMD="python export_notice_urls.py"
          if [ "$INCLUDE_PROCESSED" = "true" ]; then
            CMD="$CMD --include-processed"
          fi
          if [ "$INCLUDE_WITH_PDF" = "true" ]; then
            CMD="$CMD --include-with-pdf"
          fi

          echo "$CMD"
          eval "$CMD"

      - name: Commit URL export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/notice_url_exports

          if ! git diff --cached --quiet; then
            git commit -m "chore: export notice urls [$(date +%Y-%m-%d)]"
            git push
          else
            echo "No URL export changes."
          fi

      - name: Notify Telegram when notice URL export is ready
        if: always()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          EXPORT_FILE="$(ls -1t output/notice_url_exports/*_notice_urls.md 2>/dev/null | head -n 1 || true)"
          if [ -z "$EXPORT_FILE" ]; then
            MESSAGE="$(cat <<EOF
          정과장의 청약노트 청약홈 링크 목록 생성 워크플로우 완료

          - 결과: 링크 목록 파일을 찾지 못했습니다.
          - 실행 시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')
          - 브랜치: ${GITHUB_REF_NAME}
          - 실행 로그: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"
          else
            ROW_COUNT="$(grep -c '^| [0-9]' "$EXPORT_FILE" || true)"
            EXPORT_BASENAME="$(basename "$EXPORT_FILE")"
            EXPORT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/output/notice_url_exports/${EXPORT_BASENAME}"
            MESSAGE="$(cat <<EOF
          정과장의 청약노트 청약홈 링크 목록 생성 완료

          - 대상 공고: ${ROW_COUNT}건
          - 파일: ${EXPORT_BASENAME}
          - 실행 시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')
          - 브랜치: ${GITHUB_REF_NAME}

          링크 목록:
          ${EXPORT_URL}
          EOF
          )"
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
