name: codex-청약홈 링크 목록 만들기

on:
  workflow_dispatch:
    inputs:
      include_processed:
        description: "이미 생성된 공고 포함 여부"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      include_with_pdf:
        description: "이미 PDF가 있는 공고 포함 여부"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  export-notice-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export cached notice URLs
        run: |
          INCLUDE_PROCESSED="${{ github.event.inputs.include_processed || 'false' }}"
          INCLUDE_WITH_PDF="${{ github.event.inputs.include_with_pdf || 'false' }}"

          CMD="python export_notice_urls.py"
          if [ "$INCLUDE_PROCESSED" = "true" ]; then
            CMD="$CMD --include-processed"
          fi
          if [ "$INCLUDE_WITH_PDF" = "true" ]; then
            CMD="$CMD --include-with-pdf"
          fi

          echo "$CMD"
          eval "$CMD"

      - name: Commit URL export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/notice_url_exports

          if ! git diff --cached --quiet; then
            git commit -m "chore: export notice urls [$(date +%Y-%m-%d)]"
            git push
          else
            echo "No URL export changes."
          fi

      - name: Notify Telegram when notice URL export is ready
        if: always()
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          EXPORT_FILE="$(ls -1t output/notice_url_exports/*_notice_urls.md 2>/dev/null | head -n 1 || true)"
          if [ -z "$EXPORT_FILE" ] || [ "${{ job.status }}" != "success" ]; then
            MESSAGE="❌ 청약홈 링크 목록 생성 실패
          실행 로그: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            URL_LIST="$(python - "$EXPORT_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = []
          for line in path.read_text(encoding="utf-8").splitlines():
              if not line.startswith("| "):
                  continue
              cols = [c.strip() for c in line.strip().strip("|").split("|")]
              if len(cols) < 5:
                  continue
              if cols[0] == "공고번호" or cols[0].startswith("---"):
                  continue
              apt_name = cols[1]
              notice_url = cols[4]
              if apt_name and notice_url.startswith("http"):
                  lines.append(f"{apt_name}\n{notice_url}")
          print("\n\n".join(lines))
          PY
            )"
            MESSAGE="✅ 청약홈 링크 목록 생성 완료

          ${URL_LIST}"
          fi

          RESPONSE="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")"
          echo "Telegram API response: ${RESPONSE}"
