name: codex-청약홈 링크 목록 만들기

on:
  # 신규 공고 수집 워크플로우가 끝나면 자동으로 이어서 실행.
  # 이전에는 텔레그램 '✅ 진행' 클릭이 필요했으나, 메타 입력 자동화 흐름에서는
  # 입력 시트(MD)를 즉시 만들어 사용자가 한 번에 편집하도록 단순화.
  workflow_run:
    workflows:
      - "codex-분양공고 데이터 가져오기"
    types:
      - completed
  workflow_dispatch:
    inputs:
      include_processed:
        description: "이미 생성된 공고 포함 여부"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      include_with_pdf:
        description: "이미 PDF가 있는 공고 포함 여부"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  export-notice-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_run 으로 자동 진입한 경우엔 선행 워크플로우 성공만 처리.
    # 사람이 수동 dispatch 한 경우엔 항상 실행.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export cached notice URLs
        run: |
          INCLUDE_PROCESSED="${{ github.event.inputs.include_processed || 'false' }}"
          INCLUDE_WITH_PDF="${{ github.event.inputs.include_with_pdf || 'false' }}"

          CMD="python export_notice_urls.py"
          if [ "$INCLUDE_PROCESSED" = "true" ]; then
            CMD="$CMD --include-processed"
          fi
          if [ "$INCLUDE_WITH_PDF" = "true" ]; then
            CMD="$CMD --include-with-pdf"
          fi

          echo "$CMD"
          eval "$CMD"

      - name: Commit URL export and meta inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # notice_meta_inputs 도 함께 staging — export_notice_urls.py 가 신규 공고용
          # YAML 파일을 자동 생성하므로 같은 커밋으로 push 되어야 텔레그램 안내한
          # YAML 폴더 링크에서 해당 파일을 바로 편집 가능.
          git add output/notice_url_exports output/notice_meta_inputs

          if ! git diff --cached --quiet; then
            git commit -m "chore: export notice urls + meta inputs [$(date +%Y-%m-%d)]"
            git push
          else
            echo "No URL export / meta input changes."
          fi

      - name: Notify Telegram when notice URL export is ready
        if: always()
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          EXPORT_FILE="$(ls -1t output/notice_url_exports/*_notice_urls.md 2>/dev/null | head -n 1 || true)"
          if [ -z "$EXPORT_FILE" ] || [ "${{ job.status }}" != "success" ]; then
            MESSAGE="❌ 청약홈 링크 목록 생성 실패
          실행 로그: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            # 통계와 미입력 단지 목록을 한 번에 산출.
            SUMMARY="$(python - "$EXPORT_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          total = filled = pending = 0
          pending_lines: list[str] = []
          for line in path.read_text(encoding="utf-8").splitlines():
              if not line.startswith("| "):
                  continue
              cols = [c.strip() for c in line.strip().strip("|").split("|")]
              if len(cols) < 15:
                  continue
              if cols[0] == "공고번호" or cols[0].startswith("---"):
                  continue
              total += 1
              status = cols[14]
              if "✅" in status:
                  filled += 1
              else:
                  pending += 1
                  apt_name = cols[1]
                  notice_url = cols[4]
                  if apt_name and notice_url.startswith("http"):
                      pending_lines.append(f"{apt_name}\n{notice_url}")

          print(f"TOTAL={total}")
          print(f"FILLED={filled}")
          print(f"PENDING={pending}")
          print("---")
          print("\n\n".join(pending_lines[:10]))
          PY
            )"
            TOTAL="$(echo "$SUMMARY" | grep '^TOTAL=' | cut -d= -f2)"
            FILLED="$(echo "$SUMMARY" | grep '^FILLED=' | cut -d= -f2)"
            PENDING="$(echo "$SUMMARY" | grep '^PENDING=' | cut -d= -f2)"
            PENDING_LIST="$(echo "$SUMMARY" | sed -n '/^---$/,$p' | tail -n +2)"

            REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            BRANCH="${GITHUB_REF_NAME:-main}"
            EXPORT_REL="${EXPORT_FILE#./}"
            MD_URL="${REPO_URL}/edit/${BRANCH}/${EXPORT_REL}"
            YML_DIR_URL="${REPO_URL}/tree/${BRANCH}/output/notice_meta_inputs"

            MESSAGE="🆕 입력 시트 갱신 완료 (총 ${TOTAL}건 · 입력완료 ${FILLED} / 대기 ${PENDING})

          📝 편집 방식 두 가지:
          ① 공고별 YAML 파일 (모바일 권장 · 한 파일당 8필드만):
          ${YML_DIR_URL}

          ② 전체 표 (한눈에 보기용):
          ${MD_URL}

          YAML 값이 있으면 표보다 우선 적용됩니다.
          모든 행이 ✅ 가 되면 codex-페이지 생성 워크플로우로 일괄 발행됩니다.
          "
            if [ -n "$PENDING_LIST" ]; then
              MESSAGE="${MESSAGE}
          ── 대기 중 (상위 10건) ──
          ${PENDING_LIST}"
            fi
          fi

          RESPONSE="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")"
          echo "Telegram API response: ${RESPONSE}"
