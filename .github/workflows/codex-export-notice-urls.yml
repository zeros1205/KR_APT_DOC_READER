name: codex-청약홈 링크 목록 만들기

on:
  # 신규 공고 수집 워크플로우가 끝나면 자동으로 이어서 실행.
  # 이전에는 텔레그램 '✅ 진행' 클릭이 필요했으나, 메타 입력 자동화 흐름에서는
  # 입력 시트(MD)를 즉시 만들어 사용자가 한 번에 편집하도록 단순화.
  workflow_run:
    workflows:
      - "codex-분양공고 데이터 가져오기"
    types:
      - completed
  workflow_dispatch:
    inputs:
      include_processed:
        description: "이미 생성된 공고 포함 여부"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      include_with_pdf:
        description: "이미 PDF가 있는 공고 포함 여부"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  # 선행 collect 워크플로우가 신규 공고를 실제로 수집했는지 판별하는 게이트.
  # 신규 0건이면 아래 export-notice-urls 잡을 skip 시켜 관련 워크플로우가
  # 사실상 돌지 않도록 한다. 수동 dispatch 는 항상 통과.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      actions: read
    outputs:
      has_new: ${{ steps.decide.outputs.has_new }}
    steps:
      - name: Download new-notice flag from collect run
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: collect-has-new
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to proceed
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            # 사람이 수동 실행한 경우는 항상 진행.
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          elif [ -f has_new_flag.txt ] && [ "$(cat has_new_flag.txt | tr -d '[:space:]')" = "true" ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "신규 공고 0건 — export 잡을 건너뜁니다."
          fi

  export-notice-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    # 신규 공고가 있을 때만(또는 수동 dispatch) 실행.
    if: ${{ needs.gate.outputs.has_new == 'true' }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export cached notice URLs
        run: |
          INCLUDE_PROCESSED="${{ github.event.inputs.include_processed || 'false' }}"
          INCLUDE_WITH_PDF="${{ github.event.inputs.include_with_pdf || 'false' }}"

          # eval 제거 — 인자 배열로 직접 호출.
          ARGS=()
          if [ "$INCLUDE_PROCESSED" = "true" ]; then
            ARGS+=(--include-processed)
          fi
          if [ "$INCLUDE_WITH_PDF" = "true" ]; then
            ARGS+=(--include-with-pdf)
          fi

          echo "python export_notice_urls.py ${ARGS[*]}"
          python export_notice_urls.py "${ARGS[@]}"

      - name: Commit URL export and meta inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # notice_meta_inputs 도 함께 staging — export_notice_urls.py 가 신규 공고용
          # YAML 파일을 자동 생성하므로 같은 커밋으로 push 되어야 텔레그램 안내한
          # YAML 폴더 링크에서 해당 파일을 바로 편집 가능.
          git add output/notice_url_exports output/notice_meta_inputs

          if ! git diff --cached --quiet; then
            git commit -m "chore: export notice urls + meta inputs [$(date +%Y-%m-%d)]"
            git push
          else
            echo "No URL export / meta input changes."
          fi

      - name: Notify Telegram when notice URL export is ready
        if: always()
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          EXPORT_FILE="$(ls -1t output/notice_url_exports/*_notice_urls.md 2>/dev/null | head -n 1 || true)"
          if [ -z "$EXPORT_FILE" ] || [ "${{ job.status }}" != "success" ]; then
            MESSAGE="❌ 청약홈 링크 목록 생성 실패
          실행 로그: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            # 통계와 미입력 단지 목록을 한 번에 산출.
            SUMMARY="$(python - "$EXPORT_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          total = filled = pending = 0
          pending_lines: list[str] = []
          for line in path.read_text(encoding="utf-8").splitlines():
              if not line.startswith("| "):
                  continue
              cols = [c.strip() for c in line.strip().strip("|").split("|")]
              if len(cols) < 15:
                  continue
              if cols[0] == "공고번호" or cols[0].startswith("---"):
                  continue
              total += 1
              status = cols[14]
              if "✅" in status:
                  filled += 1
              else:
                  pending += 1
                  apt_name = cols[1]
                  notice_url = cols[4]
                  if apt_name and notice_url.startswith("http"):
                      pending_lines.append(f"{apt_name}\n{notice_url}")

          print(f"TOTAL={total}")
          print(f"FILLED={filled}")
          print(f"PENDING={pending}")
          print("---")
          print("\n\n".join(pending_lines[:10]))
          PY
            )"
            TOTAL="$(echo "$SUMMARY" | grep '^TOTAL=' | cut -d= -f2)"
            FILLED="$(echo "$SUMMARY" | grep '^FILLED=' | cut -d= -f2)"
            PENDING="$(echo "$SUMMARY" | grep '^PENDING=' | cut -d= -f2)"
            PENDING_LIST="$(echo "$SUMMARY" | sed -n '/^---$/,$p' | tail -n +2)"

            REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            BRANCH="${GITHUB_REF_NAME:-main}"
            # 알림에는 실제 운영 동선(PDF 업로드 → 페이지 생성 실행)만 담는다.
            # 입력 시트(MD)·공고별 YAML 링크는 파일로 계속 생성되지만, 메타 값은
            # 대부분 자동 추출로 prefilled 되므로 알림에서 매번 안내할 필요가 없다.
            PDF_UPLOAD_URL="${REPO_URL}/upload/${BRANCH}/input/pdfs"
            GENERATE_WF_URL="${REPO_URL}/actions/workflows/codex-generate-pages.yml"

            MESSAGE="🆕 신규 공고 확인 (총 ${TOTAL}건 · 메타 입력완료 ${FILLED} / 대기 ${PENDING})

          ① 공고문 PDF 업로드 (파일명은 '공고번호 단지명 입주자모집공고문.pdf' 형식 유지):
          ${PDF_UPLOAD_URL}

          ② 업로드 후 페이지 생성 실행 (Run workflow):
          ${GENERATE_WF_URL}

          기본값 그대로 실행하면 PDF 가 올라온 미생성 공고를 건수 제한 없이 모두 발행합니다.
          "
            if [ -n "$PENDING_LIST" ]; then
              MESSAGE="${MESSAGE}
          ── 대기 중 (상위 10건) ──
          ${PENDING_LIST}"
            fi
          fi

          RESPONSE="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")"
          echo "Telegram API response: ${RESPONSE}"
