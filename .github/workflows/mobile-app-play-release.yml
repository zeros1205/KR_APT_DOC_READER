name: Build Signed Mobile App for Play

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to build. Keep this on the known-good mobile app baseline unless intentionally changing it."
        required: true
        default: "main"
      enforce_baseline:
        description: "Fail when the checked-out mobile app does not match the current mobile release baseline markers."
        required: true
        type: boolean
        default: true
      version_code:
        description: "Android versionCode integer to apply to the signed release build."
        required: true
        default: "1"
      version_name:
        description: "App versionName (e.g. 0.1.0). Shown to users; appears on Play Store and in app settings."
        required: true
        default: "0.1.0"
      upload_to_play:
        description: "Upload the signed AAB to Play Console after build."
        required: true
        type: boolean
        default: false
      play_track:
        description: "Which Play test track to upload to (only used when upload_to_play=true). Production rollout is intentionally not available here."
        required: true
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
  pull_request:
    paths:
      - "mobile-app/**"
      - ".github/workflows/mobile-app-play-release.yml"
  push:
    branches:
      - main
    paths:
      - "mobile-app/**"
      - ".github/workflows/mobile-app-play-release.yml"

concurrency:
  group: mobile-app-play-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MOBILE_APP_DIR: mobile-app

jobs:
  signed-android-release:
    name: Build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
      KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS || secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 || secrets.GOOGLE_SERVICES_JSON_B64 || secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 || secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 || secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 || secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || secrets.ANDROID_GOOGLE_SERVICES_JSON || secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
      RELEASE_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || github.run_number }}
      RELEASE_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name || '0.1.0' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Show build source
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          echo "ref=${GITHUB_REF}"
          echo "sha=$(git rev-parse HEAD)"
          git log -1 --date=iso --pretty='commit=%H%ncommit_date=%cd%nsubject=%s'

      - name: Validate mobile app baseline markers
        env:
          ENFORCE_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce_baseline || 'true' }}
        run: |
          set -euo pipefail
          if [ "$ENFORCE_BASELINE" != "true" ]; then
            echo "Baseline marker enforcement disabled."
            exit 0
          fi

          app="$MOBILE_APP_DIR/src/App.tsx"
          css="$MOBILE_APP_DIR/src/styles.css"
          gradle="$MOBILE_APP_DIR/android/app/build.gradle"

          test -f "$app"
          test -f "$css"
          test -f "$gradle"

          grep -q "settings-open-panel" "$app" "$css"
          grep -q "settings-flat-list" "$app" "$css"
          grep -q "settings-page-copy" "$app" "$css"
          grep -q "청약Home 이동" "$app"
          grep -q "로딩 중" "$app"
          grep -q "POSTS_PER_PAGE" "$app"
          grep -q "Pagination" "$app"
          grep -q "app.aptnote.mobile" "$gradle" "$MOBILE_APP_DIR/capacitor.config.ts"
          grep -q "sync-post-assets" "$MOBILE_APP_DIR/package.json"

          if grep -q "system-nav-scrim" "$app" "$css"; then
            echo "::error::system-nav-scrim marker found. This is not the current mobile release baseline."
            exit 1
          fi
          # 과거에 제거한 커스텀 광고 구현(AptNoteAdsPlugin 등)의 재도입을 막는 가드.
          # play-services-ads 는 종료 다이얼로그용 신규 NativeAdPlugin 이 의도적으로
          # 사용하므로 가드에서 제외한다. 구 구현 마커는 계속 차단.
          if grep -R "admob-bottom-active\|frontBottomBanner\|AptNoteAdsPlugin" \
            "$MOBILE_APP_DIR/src" \
            "$MOBILE_APP_DIR/android/app/build.gradle" \
            "$MOBILE_APP_DIR/android/app/src/main/AndroidManifest.xml" \
            "$MOBILE_APP_DIR/android/app/src/main/java" \
            "$MOBILE_APP_DIR/android/app/src/main/res/values" >/dev/null; then
            echo "::error::Legacy custom-ads marker found. The removed AptNoteAdsPlugin implementation must not be reintroduced."
            exit 1
          fi

          grep -q "keystore.properties" "$gradle"
          grep -q "signingConfigs" "$gradle"
          grep -q "signingConfig signingConfigs.release" "$gradle"
          echo "Baseline marker validation passed."

      - name: Validate signing secrets
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "::error::Missing KEYSTORE_BASE64 or ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "${KEYSTORE_STORE_PASSWORD:-}" || { echo "::error::Missing KEYSTORE_STORE_PASSWORD or ANDROID_KEYSTORE_STORE_PASSWORD secret"; exit 1; }
          test -n "${KEYSTORE_KEY_ALIAS:-}" || { echo "::error::Missing KEYSTORE_KEY_ALIAS or ANDROID_KEYSTORE_KEY_ALIAS secret"; exit 1; }
          test -n "${KEYSTORE_KEY_PASSWORD:-}" || { echo "::error::Missing KEYSTORE_KEY_PASSWORD or ANDROID_KEYSTORE_KEY_PASSWORD secret"; exit 1; }
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ] && [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::notice::Google Services secret not configured. Continuing without Firebase google-services.json."
          fi

          # 운영자가 어느 secret 이름을 등록했는지 빌드 로그로 가시화 (값은 노출 X).
          # 다중 폴백 정리 시 참고. 미설정은 [-], 설정은 [✓] 만 표시.
          echo "::group::Resolved secret name origins (debug)"
          mark() { [ -n "${!1:-}" ] && echo "  [✓] ${1}" || echo "  [-] ${1}"; }
          for n in KEYSTORE_BASE64 ANDROID_KEYSTORE_BASE64 \
                   KEYSTORE_STORE_PASSWORD ANDROID_KEYSTORE_STORE_PASSWORD \
                   KEYSTORE_KEY_ALIAS ANDROID_KEYSTORE_KEY_ALIAS \
                   KEYSTORE_KEY_PASSWORD ANDROID_KEYSTORE_KEY_PASSWORD \
                   GOOGLE_SERVICES_JSON_BASE64 GOOGLE_SERVICES_JSON_B64 \
                   ANDROID_GOOGLE_SERVICES_JSON_BASE64 ANDROID_GOOGLE_SERVICES_JSON_B64 \
                   FIREBASE_GOOGLE_SERVICES_JSON_BASE64 FIREBASE_GOOGLE_SERVICES_JSON_B64 \
                   GOOGLE_SERVICES_JSON ANDROID_GOOGLE_SERVICES_JSON FIREBASE_GOOGLE_SERVICES_JSON; do
            mark "RAW_${n}"
          done
          echo "::endgroup::"
        env:
          # 폴백 분석을 위해 raw secret 이름들을 RAW_* 접두로 임시 노출 (값 마스킹은 GitHub 가 자동).
          RAW_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RAW_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RAW_KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          RAW_ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          RAW_KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          RAW_ANDROID_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          RAW_KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          RAW_ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          RAW_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RAW_GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          RAW_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
          RAW_ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
          RAW_FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
          RAW_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          RAW_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RAW_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          RAW_FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}

      - name: Validate Android version inputs
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code must be a positive integer. Received: $RELEASE_VERSION_CODE"
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION_NAME" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([+-][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::version_name must look like 1.2 or 1.2.3 (optional +meta or -pre). Received: $RELEASE_VERSION_NAME"
            exit 1
          fi
          echo "release_version_code=$RELEASE_VERSION_CODE"
          echo "release_version_name=$RELEASE_VERSION_NAME"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build web shell
        working-directory: mobile-app
        env:
          VITE_APP_VERSION: ${{ env.RELEASE_VERSION_NAME }}
          VITE_WORKER_ORIGIN: ${{ secrets.WORKER_ORIGIN }}
        run: npm run build

      - name: Write Google Services config
        working-directory: mobile-app/android/app
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            echo "Google Services config not provided; skipping Firebase config."
            exit 0
          fi
          test -s google-services.json

      - name: Write release keystore
        working-directory: mobile-app/android
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > aptnote-release.jks
          cat > keystore.properties <<EOF
          storeFile=aptnote-release.jks
          storePassword=${KEYSTORE_STORE_PASSWORD}
          keyAlias=${KEYSTORE_KEY_ALIAS}
          keyPassword=${KEYSTORE_KEY_PASSWORD}
          EOF
          test -s aptnote-release.jks
          test -s keystore.properties

      - name: Sync Capacitor Android project
        working-directory: mobile-app
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x mobile-app/android/gradlew

      - name: Build signed release AAB and APK
        working-directory: mobile-app/android
        run: ./gradlew clean bundleRelease assembleRelease -PandroidVersionCode="$RELEASE_VERSION_CODE" -PandroidVersionName="$RELEASE_VERSION_NAME" --no-daemon --stacktrace

      - name: Verify AD_ID permission in merged manifest
        run: |
          set -euo pipefail
          MERGED="$(find mobile-app/android/app/build/intermediates -path '*/release/*AndroidManifest.xml' -name 'AndroidManifest.xml' 2>/dev/null | head -1)"
          if [ -z "$MERGED" ]; then
            echo "::warning::Merged manifest not found in build intermediates. Checking source manifest instead."
            MERGED="mobile-app/android/app/src/main/AndroidManifest.xml"
          fi
          echo "--- Checking manifest: $MERGED ---"
          grep "permission" "$MERGED" || true
          echo "---"
          if ! grep -q "com.google.android.gms.permission.AD_ID" "$MERGED"; then
            echo "::error::AD_ID permission missing from manifest. Play Console will reject this build."
            exit 1
          fi
          echo "AD_ID permission verified."

      - name: Verify signed outputs
        run: |
          set -euo pipefail
          AAB="mobile-app/android/app/build/outputs/bundle/release/app-release.aab"
          APK="mobile-app/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$AAB"
          test -s "$APK"

          jarsigner -verify -verbose -certs "$AAB" > aab-signature-verify.txt
          grep -q "jar verified" aab-signature-verify.txt

          SDK_BT_DIR=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          "$SDK_BT_DIR/apksigner" verify --verbose --print-certs "$APK" > apk-signature-verify.txt

          sha256sum "$AAB" "$APK" > release-checksums.txt
          find mobile-app/dist -maxdepth 3 -type f -print0 | sort -z | xargs -0 sha256sum > web-dist-checksums.txt

      - name: Create versioned artifact files
        run: |
          set -euo pipefail
          AAB_DIR="mobile-app/android/app/build/outputs/bundle/release"
          APK_DIR="mobile-app/android/app/build/outputs/apk/release"
          cp "$AAB_DIR/app-release.aab" "$AAB_DIR/app-release-${RELEASE_VERSION_NAME}.aab"
          cp "$APK_DIR/app-release.apk" "$APK_DIR/app-release-${RELEASE_VERSION_NAME}.apk"

      - name: Upload Play release AAB
        uses: actions/upload-artifact@v4
        with:
          name: aptnote-play-release-${{ env.RELEASE_VERSION_NAME }}-${{ github.run_number }}.aab
          path: mobile-app/android/app/build/outputs/bundle/release/app-release-${{ env.RELEASE_VERSION_NAME }}.aab
          retention-days: 30

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: aptnote-play-release-${{ env.RELEASE_VERSION_NAME }}-${{ github.run_number }}.apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release-${{ env.RELEASE_VERSION_NAME }}.apk
          retention-days: 30

      - name: Set up Python (Play upload)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_play }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Play API client (Play upload)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_play }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install google-api-python-client==2.151.0 google-auth==2.35.0

      - name: Upload AAB to Play test track
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_play }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          AAB="mobile-app/android/app/build/outputs/bundle/release/app-release-${RELEASE_VERSION_NAME}.aab"
          test -s "$AAB"
          python scripts/upload_play_aab.py \
            --aab "$AAB" \
            --track "${{ inputs.play_track }}" \
            --version-name "$RELEASE_VERSION_NAME" \
            --version-code "$RELEASE_VERSION_CODE"

      # NOTE: app-version.json publish is intentionally NOT done here.
      # Building an AAB only means we have an artifact, not that users can
      # install it — Play review can take days, and a build that gets
      # rejected/withdrawn should never be advertised as "latest". The
      # `mobile-app-publish-version.yml` workflow polls the Play Developer
      # API and only updates output/app-version.json once the release is
      # actually live (status=completed) in the production track.

      - name: Upload release verification logs
        uses: actions/upload-artifact@v4
        with:
          name: aptnote-play-release-${{ github.run_number }}-verification
          path: |
            aab-signature-verify.txt
            apk-signature-verify.txt
            release-checksums.txt
            web-dist-checksums.txt
          retention-days: 30
