name: PDF 추출 모델 비교 테스트

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install anthropic google-genai python-dotenv

      - name: .env 생성
        run: |
          cat <<EOF > .env
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: PDF 추출 테스트 실행
        run: python test_pdf_extraction.py 2>&1 | tee test_result.txt

      - name: 결과를 Job Summary에 출력
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_result.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
