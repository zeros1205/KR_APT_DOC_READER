name: 분양가 범위 전수조사 및 수정

on:
  workflow_dispatch:
  schedule:
    # 매일 자동 수정 (daily.yml 이후 1시간)
    - cron: '30 1 * * *'

jobs:
  fix-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt
          pip install -q httpx

      - name: Run comprehensive price fix
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: python3 fix_prices_comprehensive.py

      - name: Regenerate index.html
        run: python3 pipeline/build_index.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/posts/ output/index.html output/sitemap.xml 2>/dev/null || true
          git add price_fix_results.json 2>/dev/null || true
          git diff --cached --quiet && echo "변경사항 없음" || \
            git commit -m "chore: 분양가 범위 자동 수정 [$(date +%Y-%m-%d)]"
          git push origin ${{ github.ref_name }}

      - name: Upload results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: price-fix-results
          path: price_fix_results.json
          retention-days: 30

      - name: Summary
        run: |
          echo "## 📊 분양가 범위 전수조사 완료" >> $GITHUB_STEP_SUMMARY
          if [ -f price_fix_results.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 결과" >> $GITHUB_STEP_SUMMARY
            python3 << 'SCRIPT'
          import json
          with open('price_fix_results.json') as f:
            results = json.load(f)

          fixed = sum(1 for r in results if r.get('status') == 'fixed')
          ok = sum(1 for r in results if r.get('status') == 'ok')
          error = sum(1 for r in results if r.get('status') not in ['fixed', 'ok'])

          print(f"- ✅ 수정됨: {fixed}개")
          print(f"- ✓ 정상: {ok}개")
          print(f"- ⚠️  오류: {error}개")
          print(f"- 총계: {len(results)}개")
          SCRIPT
          fi
