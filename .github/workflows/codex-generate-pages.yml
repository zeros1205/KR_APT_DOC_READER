name: codex-페이지 생성하기

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "최대 생성 건수, 0은 제한 없음"
        required: false
        default: "1"
      notice_id:
        description: "특정 공고번호, 비우면 캐시 순서대로 생성"
        required: false
        default: ""
      include_manual:
        description: "manual_review 공고 포함 여부"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      include_processed:
        description: "이미 생성된 공고 재생성 여부"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      require_pdf:
        description: "PDF가 있는 공고만 생성"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

concurrency:
  # cloudflare-pages-auto-deploy.yml 과 같은 그룹 — 동시 배포 충돌 방지.
  # 수동 generate-pages 실행이 가장 최신이므로 cancel-in-progress: true 로
  # 자동 배포 워크플로우의 진행 중 배포를 취소하고 이 실행이 이어받음.
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  generate-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${GEMINI_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          PUBLIC_DATA_API_KEY=${PUBLIC_DATA_API_KEY}
          EOF

      - name: Verify frozen UI files before generation
        run: python check_ui_freeze.py

      - name: Apply manual meta from latest input sheet (MD)
        # 입력 시트(notice_url_exports/*_notice_urls.md) 의 8필드 메타를 캐시에
        # 일괄 주입. 누락 행이 있어도 빌드는 진행하되, 텔레그램 알림 단계에서
        # 어떤 공고가 미입력 상태로 LLM 기본값 사용했는지 보고된다.
        # 빌드 게이트로 만들고 싶으면 --strict 옵션 사용.
        run: python tools/apply_notice_meta_md.py || true

      - name: Commit applied meta (manual_regulation / manual_finance)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/data_cache/notices
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply manual meta from input sheet [$(date +%Y-%m-%d)]"
            git push
          else
            echo "No manual meta changes."
          fi

      - name: Sync brand assets
        run: python sync_brand_assets.py

      - name: Generate posts from cache
        run: |
          LIMIT="${{ github.event.inputs.limit || '1' }}"
          NOTICE_ID="${{ github.event.inputs.notice_id || '' }}"
          INCLUDE_MANUAL="${{ github.event.inputs.include_manual || 'false' }}"
          INCLUDE_PROCESSED="${{ github.event.inputs.include_processed || 'false' }}"
          REQUIRE_PDF="${{ github.event.inputs.require_pdf || 'true' }}"

          # eval 제거 — 인자 배열로 직접 호출. notice_id 같은 사용자 입력에
          # 셸 메타문자가 있어도 안전.
          ARGS=(--limit "$LIMIT")
          if [ -n "$NOTICE_ID" ]; then
            ARGS+=(--notice-id "$NOTICE_ID")
          fi
          if [ "$INCLUDE_MANUAL" = "true" ]; then
            ARGS+=(--include-manual)
          fi
          if [ "$INCLUDE_PROCESSED" = "true" ]; then
            ARGS+=(--include-processed)
          fi
          if [ "$REQUIRE_PDF" = "true" ]; then
            ARGS+=(--require-pdf)
          fi

          echo "python generate_posts_from_cache.py ${ARGS[*]}"
          python generate_posts_from_cache.py "${ARGS[@]}" 2>&1 | tee /tmp/generate_log.txt

      - name: Patch newly created posts with v3 location analysis
        # generate_posts_from_cache.py 가 만든 SECTION 2 는 v1 본문 (3섹션, 이모지 없음).
        # 두 가지 케이스를 처리:
        #   A) NEW_IDS   — location_v3.json 없는 신규 단지 → Gemini LLM 호출 + v3 패치
        #   B) REPATCH_IDS — --include-processed 재생성으로 v3 퇴행한 단지
        #                    (location_v3.json은 있지만 post.html 에 v3-readable 없음)
        #                    → LLM 재호출 없이 캐시로 SECTION 2 만 재생성 (비용 0)
        run: |
          # A. location_v3.json 없는 신규 단지
          NEW_IDS=$(python - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          from patch_posts_location_v3 import _list_posts_by_winner_date, _kst_today
          today = _kst_today()
          new_active = _list_posts_by_winner_date(today, past=False, skip_already_patched=True)
          new_past = _list_posts_by_winner_date(today, past=True, skip_already_patched=True)
          ids = [n for n, _, _ in new_active] + [n for n, _, _ in new_past]
          print(" ".join(ids))
          PY
          )

          # B. --include-processed 재생성으로 v3 → v1 퇴행한 단지
          #    location_v3.json 존재 + post.html 에 "v3-readable" 없으면 퇴행 판정.
          REPATCH_IDS=$(python - <<'PY'
          from pathlib import Path
          posts_dir = Path("output/posts")
          regressed = []
          for post_dir in sorted(posts_dir.iterdir()):
              if not post_dir.is_dir():
                  continue
              v3_json = post_dir / "location_v3.json"
              post_html = post_dir / "post.html"
              if v3_json.exists() and post_html.exists():
                  if "v3-readable" not in post_html.read_text(encoding="utf-8"):
                      regressed.append(post_dir.name)
          print(" ".join(regressed))
          PY
          )

          if [ -z "$NEW_IDS" ] && [ -z "$REPATCH_IDS" ]; then
            echo "[v3-auto-patch] 신규·퇴행 단지 없음 — skip"
            exit 0
          fi

          export PATCH_CHECKPOINT_EVERY=5
          set +e

          if [ -n "$NEW_IDS" ]; then
            echo "[v3-auto-patch] 신규(LLM) 대상: $NEW_IDS"
            python tools/patch_posts_location_v3.py --targets $NEW_IDS --checkpoint-every 5 2>&1 | tee -a /tmp/generate_log.txt
          fi

          if [ -n "$REPATCH_IDS" ]; then
            echo "[v3-repatch] 퇴행 단지(캐시 재사용) 대상: $REPATCH_IDS"
            python tools/patch_posts_location_v3.py --targets $REPATCH_IDS --repatch-only 2>&1 | tee -a /tmp/generate_log.txt
          fi

          set -e

      - name: Verify frozen UI files after generation
        run: |
          python check_ui_freeze.py
          git diff --exit-code -- \
            UI_FREEZE_MANIFEST.json \
            templates/blog_template.html \
            templates/front_index_template.html \
            pipeline/html_renderer.py \
            pipeline/index_renderer.py \
            pipeline/shared_ui.py \
            pipeline/themes.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard output)" ]; then
            echo "No generated page changes."
            exit 0
          fi

          git stash push -u -m "generated-pages-before-rebase"
          git pull --rebase origin main
          git stash pop

          # NOTE: 아이콘/파비콘 자산(favicon, apple-touch-icon, android-chrome,
          # app_logo_*, jung_reader_logo)은 generate_app_icons.py 의 Pillow 출력이
          # 환경/버전에 따라 흔들려 자동 회귀를 일으킨 이력이 있어 자동 commit 대상에서
          # 제외. 디자인 갱신은 디자이너가 직접 output/ 에 업로드하고 별도 PR 로 머지.
          # manifest.json / site.webmanifest 는 JSON 텍스트라 안정적이므로 유지.
          git add -f output/posts output/posts_index.json output/posts_index.js output/sitemap.xml output/robots.txt output/processed_notices.json \
            output/manifest.json output/site.webmanifest

          if ! git diff --cached --quiet; then
            git commit -m "chore: generate pages [$(date +%Y-%m-%d)]"
            git push
          else
            echo "No generated page changes."
          fi

      - name: Deploy to Cloudflare Pages
        # [수정] wrangler-action@v3 폐기 이유:
        #   - FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true 환경에서 Node.js 20 빌드인
        #     wrangler-action@v3 가 강제로 Node.js 24 로 실행됨
        #   - 매 실행마다 wrangler@4.x 감지 실패 → 3.90.0 재설치 (6s 낭비)
        #   - wrangler@3.90.0 은 최신(4.94.0) 대비 API 호환성 위험
        # [해결] npm 으로 최신 wrangler 를 shell 에서 직접 설치·실행:
        #   - Node.js 버전 강제(FORCE_JAVASCRIPT_ACTIONS_TO_NODE24) 영향 없음
        #   - 항상 wrangler@latest(4.x) 사용
        #   - --branch main: production 배포 명시
        #   - --commit-dirty=true: git 워킹 트리 uncommitted 경고 억제
        run: |
          npm install -g wrangler
          wrangler pages deploy output \
            --project-name kr-apt-doc-reader \
            --branch main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify Telegram when page generation is complete
        if: always()
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          KST_TIME="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          JOB_STATUS="${{ job.status }}"

          if [ "$JOB_STATUS" = "success" ]; then
            ICON="✅"
          else
            ICON="❌"
          fi

          SUMMARY="$(python - <<'PY'
          from pathlib import Path

          log = Path("/tmp/generate_log.txt")
          if not log.exists():
              print("로그 없음")
              raise SystemExit(0)

          text = log.read_text(encoding="utf-8", errors="replace")
          # generate_posts_from_cache.py: "[generate] success=N failed=M"
          success = failed = 0
          apt_names: list[str] = []
          failed_names: list[str] = []
          for line in text.splitlines():
              if "[generate] success=" in line:
                  for token in line.split():
                      if token.startswith("success="):
                          try: success = int(token.split("=", 1)[1])
                          except: pass
                      if token.startswith("failed="):
                          try: failed = int(token.split("=", 1)[1])
                          except: pass
              elif "[generate] failed notices:" in line:
                  failed_names = [n.strip() for n in line.split(":", 1)[1].split(",") if n.strip()]
              elif line.startswith("[generate] ") and " " in line[11:]:
                  # "[generate] {notice_id} {apt_name}"
                  rest = line[11:].split(" ", 1)
                  if len(rest) == 2:
                      apt_names.append(rest[1])

          parts = [f"성공 {success}건 / 실패 {failed}건"]
          if apt_names:
              parts.append("")
              parts.append("생성:")
              parts.extend(f"- {n}" for n in apt_names[:10])
              if len(apt_names) > 10:
                  parts.append(f"외 {len(apt_names) - 10}건")
          if failed_names:
              parts.append("")
              parts.append("실패:")
              parts.extend(f"- {n}" for n in failed_names[:5])
          print("\n".join(parts))
          PY
          )"

          MESSAGE="${ICON} 페이지 생성 완료 (${KST_TIME})

          ${SUMMARY}

          실행 로그: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          RESPONSE="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")"
          echo "Telegram API response: ${RESPONSE}"
