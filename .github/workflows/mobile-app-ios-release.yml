name: Build Signed Mobile App for TestFlight

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to build."
        required: true
        default: "main"
      version_name:
        description: "App version (e.g. 1.0.0). Shown in App Store Connect and in-app settings."
        required: true
        default: "1.0.0"
      build_number:
        description: "Build number integer (must be higher than previous TestFlight build)."
        required: true
        default: "1"
      upload_to_testflight:
        description: "Upload .ipa to TestFlight after build."
        required: true
        type: boolean
        default: true

concurrency:
  group: mobile-app-ios-release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MOBILE_APP_DIR: mobile-app

jobs:
  signed-ios-release:
    name: Build signed iOS release
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Show build source
        run: |
          set -euo pipefail
          echo "event=${{ github.event_name }}"
          echo "ref=${GITHUB_REF}"
          echo "sha=$(git rev-parse HEAD)"
          git log -1 --date=iso --pretty='commit=%H%ncommit_date=%cd%nsubject=%s'

      - name: Validate mobile app baseline markers
        run: |
          set -euo pipefail
          app="$MOBILE_APP_DIR/src/App.tsx"
          css="$MOBILE_APP_DIR/src/styles.css"

          test -f "$app"
          test -f "$css"

          grep -q "settings-open-panel" "$app" "$css"
          grep -q "settings-flat-list" "$app" "$css"
          grep -q "app.aptnote.mobile" "$MOBILE_APP_DIR/capacitor.config.ts"
          grep -q "sync-post-assets" "$MOBILE_APP_DIR/package.json"
          echo "Baseline marker validation passed."

      - name: Validate iOS secrets
        run: |
          set -euo pipefail
          test -n "${{ secrets.IOS_CERTIFICATE_CER_BASE64 }}" \
            || { echo "::error::Missing IOS_CERTIFICATE_CER_BASE64 secret"; exit 1; }
          test -n "${{ secrets.IOS_PRIVATE_KEY_BASE64 }}" \
            || { echo "::error::Missing IOS_PRIVATE_KEY_BASE64 secret"; exit 1; }
          test -n "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" \
            || { echo "::error::Missing IOS_CERTIFICATE_PASSWORD secret"; exit 1; }
          test -n "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" \
            || { echo "::error::Missing IOS_PROVISIONING_PROFILE_BASE64 secret"; exit 1; }

      - name: Validate version inputs
        run: |
          set -euo pipefail
          if ! [[ "${{ inputs.version_name }}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::version_name must be x.y or x.y.z. Got: ${{ inputs.version_name }}"
            exit 1
          fi
          if ! [[ "${{ inputs.build_number }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::build_number must be a positive integer. Got: ${{ inputs.build_number }}"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Node dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build web shell
        working-directory: mobile-app
        env:
          VITE_APP_VERSION: ${{ inputs.version_name }}
        run: npm run build

      - name: Write GoogleService-Info.plist (Firebase)
        working-directory: mobile-app
        run: |
          set -euo pipefail
          PLIST_B64="${{ secrets.IOS_GOOGLE_SERVICES_PLIST_BASE64 }}"
          if [ -z "${PLIST_B64:-}" ]; then
            echo "::notice::IOS_GOOGLE_SERVICES_PLIST_BASE64 not set; skipping Firebase config."
            exit 0
          fi
          printf '%s' "$PLIST_B64" | base64 --decode > ios/App/App/GoogleService-Info.plist
          test -s ios/App/App/GoogleService-Info.plist

      - name: Add Capacitor iOS platform (if not already present)
        working-directory: mobile-app
        run: |
          set -euo pipefail
          if [ ! -d ios ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS project
        working-directory: mobile-app
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: mobile-app/ios/App
        run: pod install --repo-update

      - name: Import signing certificate into keychain
        env:
          CER_BASE64: ${{ secrets.IOS_CERTIFICATE_CER_BASE64 }}
          KEY_BASE64: ${{ secrets.IOS_PRIVATE_KEY_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$CER_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.cer"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private.key"

          openssl x509 -in "$RUNNER_TEMP/certificate.cer" -inform DER -out "$RUNNER_TEMP/certificate.pem" -outform PEM
          openssl pkcs12 -export -legacy \
            -in "$RUNNER_TEMP/certificate.pem" \
            -inkey "$RUNNER_TEMP/private.key" \
            -out "$RUNNER_TEMP/certificate.p12" \
            -name "iOS Distribution" \
            -passin pass: -passout pass:"$P12_PASSWORD"

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
            | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILES_DIR/${PROFILE_UUID}.mobileprovision"
          echo "Installed provisioning profile UUID: $PROFILE_UUID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Set version in Xcode project
        working-directory: mobile-app/ios/App
        run: |
          set -euo pipefail
          xcrun agvtool new-marketing-version "${{ inputs.version_name }}"
          xcrun agvtool new-version -all "${{ inputs.build_number }}"

      - name: Configure App target signing (project.pbxproj)
        working-directory: mobile-app/ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.open('App.xcodeproj')
            project.targets.each do |target|
              next unless target.name == 'App'
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
                config.build_settings['DEVELOPMENT_TEAM'] = ENV['TEAM_ID']
                config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROFILE_NAME']
                config.build_settings['CODE_SIGN_IDENTITY'] = 'iPhone Distribution'
                config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'iPhone Distribution'
                config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
              end
              if File.exist?('App/GoogleService-Info.plist')
                group = project.main_group.find_subpath('App', true)
                already = target.resources_build_phase.files.any? do |bf|
                  ref = bf.file_ref
                  ref && (ref.path == 'GoogleService-Info.plist' || ref.path&.end_with?('/GoogleService-Info.plist'))
                end
                unless already
                  file_ref = group.files.find { |f| f.path == 'GoogleService-Info.plist' } ||
                             group.new_reference('GoogleService-Info.plist')
                  target.resources_build_phase.add_file_reference(file_ref, true)
                  puts 'Added GoogleService-Info.plist to App target Resources.'
                else
                  puts 'GoogleService-Info.plist already in App target Resources.'
                end
              else
                puts 'WARN: App/GoogleService-Info.plist not found on disk; skipping registration.'
              end
            end
            project.save
            puts 'App target signing configured.'
          "

      - name: Build and archive iOS app
        working-directory: mobile-app/ios/App
        run: |
          set -euo pipefail
          # 사이즈 최적화 빌드 설정을 command-line override 로 주입.
          # Podfile post_install 은 pods 에만 적용되므로 App 타겟에도
          # 동일한 플래그를 명시해 dead-code stripping / LTO 가 전체 산출물에 동작하도록 함.
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            COPY_PHASE_STRIP=YES \
            DEAD_CODE_STRIPPING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            LLVM_LTO=YES_THIN \
            SWIFT_COMPILATION_MODE=wholemodule \
            GCC_OPTIMIZATION_LEVEL=s \
            DEPLOYMENT_POSTPROCESSING=YES \
            ENABLE_BITCODE=NO

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>iPhone Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.aptnote.mobile</key>
              <string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          IPA="$(find "$RUNNER_TEMP/ipa" -name '*.ipa' | head -n 1)"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Verify IPA
        run: |
          set -euo pipefail
          test -s "$IPA_PATH"
          sha256sum "$IPA_PATH" > "$RUNNER_TEMP/ios-checksums.txt"
          cat "$RUNNER_TEMP/ios-checksums.txt"

      - name: Report IPA size breakdown
        # 순수 진단(용량 리포트) 스텝. 여기서 실패해도 TestFlight 업로드/아티팩트
        # 업로드를 막지 않도록 continue-on-error 로 격리한다. (과거 run 에서 이 스텝의
        # `sort | head` / `find | head` 파이프가 SIGPIPE 로 죽으며 릴리즈 전체가 실패함)
        continue-on-error: true
        run: |
          # 진단용이므로 pipefail/-e 는 쓰지 않는다: head 조기 종료로 인한 SIGPIPE 가
          # 리포트 생성을 중단시키지 않도록 -u 만 유지.
          set -u
          REPORT="$RUNNER_TEMP/ios-size-report.txt"
          {
            echo "=== IPA file size ==="
            ls -lh "$IPA_PATH"
            echo ""
            echo "=== IPA contents (largest 20) ==="
            unzip -l "$IPA_PATH" | sort -k1 -n -r | head -25
            echo ""
            echo "=== Framework sizes (Payload/App.app/Frameworks) ==="
            INSPECT_DIR="$RUNNER_TEMP/ipa_inspect"
            rm -rf "$INSPECT_DIR"
            mkdir -p "$INSPECT_DIR"
            unzip -q "$IPA_PATH" -d "$INSPECT_DIR"
            APP_BUNDLE="$(find "$INSPECT_DIR/Payload" -maxdepth 1 -name '*.app' | head -n 1)"
            if [ -d "$APP_BUNDLE/Frameworks" ]; then
              du -sh "$APP_BUNDLE/Frameworks/"* 2>/dev/null | sort -h
            else
              echo "(no embedded Frameworks directory — static linking active)"
            fi
            echo ""
            echo "=== App binary size ==="
            du -sh "$APP_BUNDLE"
            if [ -f "$APP_BUNDLE/App" ]; then
              ls -lh "$APP_BUNDLE/App"
            fi
          } | tee "$REPORT"

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: aptnote-ios-${{ inputs.version_name }}-${{ inputs.build_number }}.ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 30

      - name: Upload verification logs
        uses: actions/upload-artifact@v4
        with:
          name: aptnote-ios-${{ inputs.version_name }}-${{ inputs.build_number }}-verification
          path: |
            ${{ runner.temp }}/ios-checksums.txt
            ${{ runner.temp }}/ios-size-report.txt
          retention-days: 30

      # NOTE: app-version.json publish is intentionally NOT done here.
      # Uploading to TestFlight does not mean the version is available to
      # production users — App Store review can take days, and a rejected
      # version should never appear as "latest". The
      # `mobile-app-publish-version.yml` workflow polls App Store Connect
      # and only updates output/app-version.json once the version reaches
      # READY_FOR_SALE.
