name: 청약 공고 자동 수집 및 포스팅 생성

on:
  schedule:
    # 매일 오전 9시 KST (= UTC 00:00)
    - cron: '0 0 * * *'
  # 수동 실행 버튼 (GitHub Actions 탭에서 클릭 가능)
  workflow_dispatch:
    inputs:
      days:
        description: '최근 N일 공고 수집'
        default: '7'
      limit:
        description: '최대 처리 건수'
        default: '3'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 환경 확인
        run: |
          python -c "
          import os
          import sys

          print('=' * 60)
          print('🔍 워크플로우 환경 확인')
          print('=' * 60)

          gemini = os.getenv('GEMINI_API_KEY', '')
          public = os.getenv('PUBLIC_DATA_API_KEY', '')
          cloudflare = os.getenv('CLOUDFLARE_API_TOKEN', '')

          checks = {
              'GEMINI_API_KEY': bool(gemini),
              'PUBLIC_DATA_API_KEY': bool(public),
              'CLOUDFLARE_API_TOKEN': bool(cloudflare),
          }

          for key, status in checks.items():
              icon = '✅' if status else '❌'
              print(f'{icon} {key}: {\"설정됨\" if status else \"미설정\"}')

          print('=' * 60)

          if not gemini:
              print('❌ 오류: GEMINI_API_KEY 필수 설정')
              sys.exit(1)
          "

      - name: Google Search Grounding 테스트
        continue-on-error: true
        run: |
          echo "🧪 Google Search Grounding 테스트 시작..."
          python test_google_grounding.py || echo "⚠️  Grounding 테스트 스킵 (영향 없음)"

      - name: 파이프라인 설정 확인
        run: |
          python -c "
          from pipeline.config import LLM_EXTRACT_MODEL, LLM_CONTENT_MODEL, LLM_FACTCHECK_MODEL
          print('📋 파이프라인 모델 설정 확인')
          print(f'  - 팩트 추출: {LLM_EXTRACT_MODEL}')
          print(f'  - 콘텐츠 생성: {LLM_CONTENT_MODEL}')
          print(f'  - 팩트 체크: {LLM_FACTCHECK_MODEL}')
          assert LLM_EXTRACT_MODEL == 'gemini-3.1-pro-preview', f'잘못된 모델: {LLM_EXTRACT_MODEL}'
          print('✅ 모든 모델이 gemini-3.1-pro-preview로 올바르게 설정됨')
          "

      - name: 파이프라인 실행
        run: |
          DAYS=${{ github.event.inputs.days || '7' }}
          LIMIT=${{ github.event.inputs.limit || '3' }}
          echo "🚀 파이프라인 시작 (days=$DAYS, limit=$LIMIT)"
          python run.py --days $DAYS --limit $LIMIT || {
            echo "❌ 파이프라인 실행 실패"
            exit 1
          }

      - name: 프론트페이지 재생성
        run: |
          echo "📄 프론트페이지(index.html) 재생성..."
          python pipeline/build_index.py

      - name: 생성 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/posts/ output/index.html output/sitemap.xml output/robots.txt output/processed_notices.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "ℹ️  변경사항 없음 (새 포스팅 없음)"
          else
            echo "📝 변경사항 감지 - 커밋 중..."
            git commit -m "chore: 분양공고 포스팅 자동 생성 [$(date +%Y-%m-%d)]"
            git push origin ${{ github.ref_name }}
            echo "✅ 커밋 및 푸시 완료"
          fi

      - name: Node.js 설정 (Cloudflare 배포용)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wrangler 설치
        run: npm install -g wrangler

      - name: Cloudflare 배포 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️  Cloudflare 토큰 없음 (스킵)"
            echo "배포 필요 시: GitHub Settings → Secrets → CLOUDFLARE_API_TOKEN 추가"
          else
            echo "✅ Cloudflare 배포 준비 완료"
          fi

      - name: Cloudflare Workers 배포
        if: ${{ success() && github.ref_name == 'main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "🚀 Cloudflare에 배포 중..."
          wrangler deploy
          echo "✅ Cloudflare 배포 완료"

      - name: 워크플로우 완료 요약
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════"
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 워크플로우 성공적으로 완료"
          else
            echo "❌ 워크플로우 실패"
          fi
          echo "════════════════════════════════════════"
          echo "📊 실행 정보:"
          echo "  - 저장소: ${{ github.repository }}"
          echo "  - 브랜치: ${{ github.ref_name }}"
          echo "  - 실행 시간: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "  - 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: 생성된 포스팅 백업
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: posts-backup-${{ github.run_id }}
          path: output/posts/
          retention-days: 7
          if-no-files-found: ignore
