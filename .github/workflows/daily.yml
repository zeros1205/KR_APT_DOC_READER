name: 청약 공고 자동 수집 및 포스팅 생성

on:
  schedule:
    # 매일 오전 9시 KST (= UTC 00:00)
    - cron: '0 0 * * *'
  # 수동 실행 버튼 (GitHub Actions 탭에서 클릭 가능)
  workflow_dispatch:
    inputs:
      days:
        description: '최근 N일 공고 수집'
        default: '7'
      limit:
        description: '최대 처리 건수'
        default: '3'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: API 키 확인
        run: |
          python -c "
          import os
          gemini = os.getenv('GEMINI_API_KEY', '')
          public = os.getenv('PUBLIC_DATA_API_KEY', '')
          print(f'✅ GEMINI_API_KEY: {\"설정됨\" if gemini else \"미설정\"}')
          print(f'✅ PUBLIC_DATA_API_KEY: {\"설정됨\" if public else \"미설정\"}')
          if not gemini:
              print('⚠️  경고: GEMINI_API_KEY가 없습니다')
          "

      - name: Google Search Grounding 테스트
        continue-on-error: true
        run: python test_google_grounding.py

      - name: 파이프라인 실행 전 검증
        run: |
          python -c "
          import os
          gemini_key = os.getenv('GEMINI_API_KEY', '')
          if not gemini_key:
              print('❌ 오류: GEMINI_API_KEY가 설정되지 않았습니다')
              print('GitHub Settings → Secrets and variables → Actions 에서 GEMINI_API_KEY 추가 필요')
              exit(1)
          print('✅ GEMINI_API_KEY 설정됨 - 파이프라인 실행 준비')
          "

      - name: 파이프라인 실행
        run: |
          DAYS=${{ github.event.inputs.days || '7' }}
          LIMIT=${{ github.event.inputs.limit || '3' }}
          python run.py --days $DAYS --limit $LIMIT

      - name: 프론트페이지(index.html) 재생성
        run: python pipeline/build_index.py

      - name: 생성된 포스팅 repo에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/posts/ output/index.html output/sitemap.xml output/robots.txt output/processed_notices.json 2>/dev/null || true
          git diff --cached --quiet && echo "커밋할 변경사항 없음" || \
            git commit -m "chore: 분양공고 포스팅 자동 생성 [$(date +%Y-%m-%d)]"
          git push origin ${{ github.ref_name }}

      - name: Node.js 설정 (Cloudflare 배포용)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wrangler 설치
        run: npm install -g wrangler

      - name: Cloudflare 배포 전 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️  경고: CLOUDFLARE_API_TOKEN이 설정되지 않았습니다"
            echo "GitHub Settings → Secrets → CLOUDFLARE_API_TOKEN 추가 필요"
          else
            echo "✅ CLOUDFLARE_API_TOKEN 설정됨"
          fi

      - name: Cloudflare에 배포
        if: ${{ success() && github.ref_name == 'main' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: wrangler deploy

      - name: 생성된 포스팅 업로드 (아티팩트 백업)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: posts-${{ github.run_id }}
          path: output/posts/
          retention-days: 7
          if-no-files-found: ignore
