name: 분양공고 포스팅 자동화

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 UTC 00:00 (KST 09:00)
  workflow_dispatch:
    inputs:
      days:
        description: '최근 N일 공고 수집'
        default: '150'
      collect_limit:
        description: '수집 최대 건수 (0=무제한)'
        default: '0'
      generate_limit:
        description: '포스트 생성 최대 건수 (0=무제한)'
        default: '3'

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 가상환경 캐시
        uses: actions/cache@v4
        id: venv-cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}

      - name: ChromaDB 모델 캐싱
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-models-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            chroma-models-

      - name: 의존성 설치
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: 가상환경 PATH 등록
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: 환경 변수 설정
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          PUBLIC_DATA_API_KEY=${{ secrets.PUBLIC_DATA_API_KEY }}
          EOF

      - name: 환경 검증
        run: |
          python -c "
          import os
          from dotenv import load_dotenv
          load_dotenv()

          gemini_key = os.getenv('GEMINI_API_KEY', '')
          if gemini_key:
            print(f'✓ GEMINI_API_KEY: {gemini_key[:10]}...{gemini_key[-5:]} (길이: {len(gemini_key)})')
          else:
            print('❌ GEMINI_API_KEY: 설정되지 않음')
            exit(1)

          public_key = os.getenv('PUBLIC_DATA_API_KEY', '')
          if public_key:
            print(f'✓ PUBLIC_DATA_API_KEY: {public_key[:10]}...{public_key[-5:]} (길이: {len(public_key)})')
          else:
            print('⚠️  PUBLIC_DATA_API_KEY: 설정되지 않음')

          from pipeline.config import LLM_EXTRACT_MODEL
          print(f'✓ LLM_EXTRACT_MODEL: {LLM_EXTRACT_MODEL}')
          "

      # ── Step 1: 공공데이터 API 수집 → data_cache 저장 ──────────────────
      - name: 공고 데이터 수집
        run: |
          DAYS=${{ github.event.inputs.days || '150' }}
          LIMIT=${{ github.event.inputs.collect_limit || '0' }}
          if [ "$LIMIT" = "0" ]; then
            python collect_notices_weekly.py --days $DAYS
          else
            python collect_notices_weekly.py --days $DAYS --limit $LIMIT
          fi

      - name: 수집 결과 확인
        if: always()
        run: |
          echo "=== data_cache 현황 ==="
          if [ -d "output/data_cache/notices" ]; then
            COUNT=$(ls output/data_cache/notices/*.json 2>/dev/null | wc -l)
            echo "📦 캐시된 공고: $COUNT개"
          fi
          if [ -f "output/data_cache/manual_review/missing_fields.csv" ]; then
            MANUAL=$(tail -n +2 output/data_cache/manual_review/missing_fields.csv | wc -l)
            echo "⚠️  수동 검토 필요: $MANUAL건"
          fi

      # ── Step 2: cache → 포스트 생성 + index/sitemap/robots 재빌드 ───────
      - name: 포스트 생성
        run: |
          LIMIT=${{ github.event.inputs.generate_limit || '3' }}
          if [ "$LIMIT" = "0" ]; then
            python generate_posts_from_cache.py
          else
            python generate_posts_from_cache.py --limit $LIMIT
          fi

      - name: 생성 결과 확인
        if: always()
        run: |
          echo "=== 포스트 생성 결과 ==="
          if [ -d "output/posts" ]; then
            COUNT=$(find output/posts -name "post.html" | wc -l)
            echo "📝 전체 포스팅: $COUNT개"
          fi
          if [ -f "output/processed_notices.json" ]; then
            PROCESSED=$(python3 -c "import json; d=json.load(open('output/processed_notices.json')); print(len(d))")
            echo "✅ 처리 완료 누적: $PROCESSED개"
          fi

      # ── Step 3: 변경사항 커밋 & 푸시 (Cloudflare Pages 자동 배포 트리거) ──
      - name: 커밋 및 푸시
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # pull 먼저 (스테이징 전에 해야 rebase 충돌 없음)
          git pull --rebase origin main

          # gitignore 제외 산출물 강제 추가
          git add -f output/posts/ output/index.html output/sitemap.xml output/robots.txt 2>/dev/null || true
          # 추적 대상 파일 추가
          git add output/data_cache/ output/processed_notices.json output/manifest.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: 분양공고 포스팅 자동 생성 [$(date +%Y-%m-%d)]"
            git push -u origin main
          else
            echo "신규 변경사항 없음 — 커밋 스킵"
          fi

      - name: 아티팩트 백업
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posts-backup-${{ github.run_id }}
          path: output/posts/
          retention-days: 7
          if-no-files-found: ignore
