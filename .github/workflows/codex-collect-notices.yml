name: codex-분양공고 데이터 가져오기

on:
  schedule:
    - cron: "0 23 * * *"  # 08:00 KST (전일 23:00 UTC)
    - cron: "0 2 * * *"   # 11:00 KST (당일 02:00 UTC)
    - cron: "0 6 * * *"   # 15:00 KST (당일 06:00 UTC)
  workflow_dispatch:
    inputs:
      days:
        description: "최근 N일 공고 수집"
        required: false
        default: "7"
      start_date:
        description: "조회 시작일 YYYY-MM-DD, 비우면 days 사용"
        required: false
        default: ""
      limit:
        description: "최대 수집 건수, 0은 제한 없음"
        required: false
        default: "0"
      notice_id:
        description: "공고번호(PBLANC_NO) 직접 조회, 콤마로 여러 건. 비우면 날짜 범위 사용"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  collect-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${GEMINI_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          PUBLIC_DATA_API_KEY=${PUBLIC_DATA_API_KEY}
          EOF

      - name: Collect public notice data
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          START_DATE="${{ github.event.inputs.start_date || '' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          NOTICE_ID="${{ github.event.inputs.notice_id || '' }}"

          # eval 제거 — 사용자 입력의 셸 메타문자가 명령으로 해석되지 않도록
          # 인자 배열로 직접 호출 (location-v3-active-posts.yml 와 같은 패턴).
          ARGS=(--days "$DAYS" --limit "$LIMIT")
          if [ -n "$START_DATE" ]; then
            ARGS+=(--start-date "$START_DATE")
          fi
          # 공고번호 직접 조회 (콤마 구분). 지정 시 스크립트가 날짜 범위 대신
          # PBLANC_NO::EQ 단건 조회 경로를 사용한다.
          if [ -n "$NOTICE_ID" ]; then
            IFS=',' read -ra NIDS <<< "$NOTICE_ID"
            for nid in "${NIDS[@]}"; do
              nid_trimmed="$(echo "$nid" | tr -d '[:space:]')"
              [ -n "$nid_trimmed" ] && ARGS+=(--notice-id "$nid_trimmed")
            done
          fi

          echo "python collect_notices_weekly.py ${ARGS[*]}"
          python collect_notices_weekly.py "${ARGS[@]}"

      - name: Detect new notice cache files
        id: cache_changes
        run: |
          NOTICE_CHANGES="$(git status --porcelain -- output/data_cache/notices | wc -l | tr -d ' ')"
          if [ "$NOTICE_CHANGES" -gt 0 ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi
          echo "notice_changes=$NOTICE_CHANGES" >> "$GITHUB_OUTPUT"
          {
            echo "changed_files<<EOF"
            git status --porcelain -- output/data_cache/notices | awk '{print $2}' | head -20
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit cache changes
        if: steps.cache_changes.outputs.has_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/data_cache

          if ! git diff --cached --quiet; then
            git commit -m "chore: collect notice cache [$(date +%Y-%m-%d)]"
            git push
          else
            echo "No cache changes."
          fi

      - name: Refresh posts index (grey-status daily sync)
        # 당첨자 발표일이 지난 공고 카드의 그레이 헤더를 실시간 반영.
        # codex-generate-pages.yml 이 수동 실행되지 않더라도 하루 3회 자동으로
        # posts_index.json / posts_index.js 를 오늘 날짜 기준으로 재빌드.
        # render_shell=False → index.html 은 건드리지 않고 동적 데이터만 갱신.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pipeline.index_renderer import build_front_index
          build_front_index(render_shell=False)
          PY

          # 변경된 파일이 있을 때만 커밋
          if git diff --quiet output/posts_index.json output/posts_index.js output/sitemap.xml output/robots.txt \
             && [ -z "$(git ls-files --others --exclude-standard \
                          output/posts_index.json output/posts_index.js \
                          output/sitemap.xml output/robots.txt)" ]; then
            echo "[index-refresh] posts_index unchanged — skip commit"
            exit 0
          fi

          # 병렬 push 충돌 방지: stash → rebase → pop 패턴
          git stash push -u -m "index-refresh-before-rebase"
          git pull --rebase origin main
          git stash pop

          git add -f output/posts_index.json output/posts_index.js \
                     output/sitemap.xml output/robots.txt

          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh posts index [$(TZ=Asia/Seoul date '+%Y-%m-%d')]"
            git push
          else
            echo "[index-refresh] No diff after rebase — skip commit"
          fi

      - name: Notify Telegram when notice collection is complete
        if: always()
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          KST_TIME="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          if [ "${{ steps.cache_changes.outputs.has_new }}" = "true" ]; then
            NOTICE_DETAILS="$(python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          changed = subprocess.check_output(
              ["git", "show", "--name-only", "--format=", "HEAD"],
              text=True,
              encoding="utf-8",
          ).splitlines()

          notice_files = [
              Path(path)
              for path in changed
              if path.startswith("output/data_cache/notices/") and path.endswith(".json")
          ]

          rows = []
          for path in notice_files[:10]:
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              doc = payload.get("document") or {}
              raw = payload.get("detail_raw") or {}
              apt_name = str(doc.get("apt_name") or raw.get("HOUSE_NM") or payload.get("apt_name") or "").strip()
              rows.append(apt_name or path.stem)

          lines = [f"- {name}" for name in rows]
          extra = len(notice_files) - len(rows)
          if extra > 0:
              lines.append(f"외 {extra}건")

          print("\\n".join(lines).strip())
          PY
            )"
            MESSAGE="🆕 신규 공고 ${{ steps.cache_changes.outputs.notice_changes }}건 수집 완료 (${KST_TIME})

          ${NOTICE_DETAILS}

          입력 시트 자동 갱신이 이어서 진행됩니다. (workflow_run)"

            RESPONSE="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}")"
          else
            MESSAGE="✅ 공고 수집 완료 (${KST_TIME})

          신규 공고 0건"

            RESPONSE="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MESSAGE}")"
          fi

          echo "Telegram API response: ${RESPONSE}"

