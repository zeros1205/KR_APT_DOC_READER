name: codex-분양공고 데이터 가져오기

on:
  schedule:
    # 09:00 Asia/Seoul = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "최근 N일 공고 수집"
        required: false
        default: "7"
      start_date:
        description: "조회 시작일 YYYY-MM-DD, 비우면 days 사용"
        required: false
        default: ""
      limit:
        description: "최대 수집 건수, 0은 제한 없음"
        required: false
        default: "0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  collect-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${GEMINI_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          PUBLIC_DATA_API_KEY=${PUBLIC_DATA_API_KEY}
          EOF

      - name: Collect public notice data
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          START_DATE="${{ github.event.inputs.start_date || '' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"

          CMD="python collect_notices_weekly.py --days $DAYS --limit $LIMIT"
          if [ -n "$START_DATE" ]; then
            CMD="$CMD --start-date $START_DATE"
          fi

          echo "$CMD"
          eval "$CMD"

      - name: Detect new notice cache files
        id: cache_changes
        run: |
          NOTICE_CHANGES="$(git status --porcelain -- output/data_cache/notices | wc -l | tr -d ' ')"
          if [ "$NOTICE_CHANGES" -gt 0 ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi
          echo "notice_changes=$NOTICE_CHANGES" >> "$GITHUB_OUTPUT"
          {
            echo "changed_files<<EOF"
            git status --porcelain -- output/data_cache/notices | awk '{print $2}' | head -20
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit cache changes
        if: steps.cache_changes.outputs.has_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/data_cache

          if ! git diff --cached --quiet; then
            git commit -m "chore: collect notice cache [$(date +%Y-%m-%d)]"
            git push
          else
            echo "No cache changes."
          fi

      - name: Notify Telegram when notice collection is complete
        if: always()
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          COMMIT_SHA="$(git rev-parse --short HEAD)"
          if [ "${{ steps.cache_changes.outputs.has_new }}" = "true" ]; then
            NOTICE_DETAILS="$(python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          changed = subprocess.check_output(
              ["git", "show", "--name-only", "--format=", "HEAD"],
              text=True,
              encoding="utf-8",
          ).splitlines()

          notice_files = [
              Path(path)
              for path in changed
              if path.startswith("output/data_cache/notices/") and path.endswith(".json")
          ]

          rows = []
          for path in notice_files[:10]:
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              doc = payload.get("document") or {}
              raw = payload.get("detail_raw") or {}
              notice_id = str(payload.get("notice_id") or doc.get("notice_id") or raw.get("PBLANC_NO") or path.stem)
              apt_name = str(doc.get("apt_name") or raw.get("HOUSE_NM") or payload.get("apt_name") or "").strip()
              notice_date = str(doc.get("notice_date") or raw.get("RCRIT_PBLANC_DE") or "").strip()
              notice_url = str(doc.get("notice_url") or raw.get("PBLANC_URL") or "").strip()
              rows.append((notice_id, apt_name, notice_date, notice_url))

          lines = []
          for idx, (notice_id, apt_name, notice_date, notice_url) in enumerate(rows, 1):
              lines.append(f"{idx}. {apt_name or '단지명 미기재'}")
              lines.append(f"공고번호: {notice_id}")
              if notice_date:
                  lines.append(f"모집공고일: {notice_date}")
              if notice_url:
                  lines.append(f"청약홈 URL: {notice_url}")
              lines.append("")

          extra = len(notice_files) - len(rows)
          if extra > 0:
              lines.append(f"외 {extra}건은 GitHub 변경 파일 목록을 확인하세요.")

          print("\\n".join(lines).strip())
          PY
            )"
            MESSAGE="$(cat <<EOF
          정과장의 청약노트 신규 공고 데이터 수집 완료

          - 신규/변경 공고 파일: ${{ steps.cache_changes.outputs.notice_changes }}건
          - 실행 시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')
          - 브랜치: ${GITHUB_REF_NAME}
          - 커밋: ${COMMIT_SHA}

          청약홈 URL:
          ${NOTICE_DETAILS}
          EOF
            )"
          else
            MESSAGE="$(cat <<EOF
          정과장의 청약노트 공고 데이터 수집 완료

          - 신규/변경 공고 파일: 0건
          - 실행 시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')
          - 브랜치: ${GITHUB_REF_NAME}
          - 커밋: ${COMMIT_SHA}

          새로 추가된 청약홈 URL은 없습니다.
          EOF
            )"
          fi

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"

      - name: Refresh dynamic front card data
        run: python pipeline/index_renderer.py --data-only

      - name: Commit front card status changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/posts_index.json output/posts_index.js output/sitemap.xml output/robots.txt

          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh front card status [$(TZ=Asia/Seoul date +%Y-%m-%d)]"
            git push
          else
            echo "No front card status changes."
          fi
