name: codex-분양공고 데이터 가져오기

on:
  schedule:
    # 09:00 Asia/Seoul = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "최근 N일 공고 수집"
        required: false
        default: "7"
      start_date:
        description: "조회 시작일 YYYY-MM-DD, 비우면 days 사용"
        required: false
        default: ""
      limit:
        description: "최대 수집 건수, 0은 제한 없음"
        required: false
        default: "0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  collect-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${GEMINI_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          PUBLIC_DATA_API_KEY=${PUBLIC_DATA_API_KEY}
          EOF

      - name: Collect public notice data
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          START_DATE="${{ github.event.inputs.start_date || '' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"

          CMD="python collect_notices_weekly.py --days $DAYS --limit $LIMIT"
          if [ -n "$START_DATE" ]; then
            CMD="$CMD --start-date $START_DATE"
          fi

          echo "$CMD"
          eval "$CMD"

      - name: Detect new notice cache files
        id: cache_changes
        run: |
          NOTICE_CHANGES="$(git status --porcelain -- output/data_cache/notices | wc -l | tr -d ' ')"
          if [ "$NOTICE_CHANGES" -gt 0 ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi
          echo "notice_changes=$NOTICE_CHANGES" >> "$GITHUB_OUTPUT"
          {
            echo "changed_files<<EOF"
            git status --porcelain -- output/data_cache/notices | awk '{print $2}' | head -20
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit cache changes
        if: steps.cache_changes.outputs.has_new == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/data_cache

          if ! git diff --cached --quiet; then
            git commit -m "chore: collect notice cache [$(date +%Y-%m-%d)]"
            git push
          else
            echo "No cache changes."
          fi

      - name: Notify Telegram when new notices are collected
        if: steps.cache_changes.outputs.has_new == 'true'
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          COMMIT_SHA="$(git rev-parse --short HEAD)"
          MESSAGE="$(cat <<EOF
정과장의 청약노트 신규 공고 데이터 수집 완료

- 신규/변경 공고 파일: ${{ steps.cache_changes.outputs.notice_changes }}건
- 실행 시간: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')
- 브랜치: ${GITHUB_REF_NAME}
- 커밋: ${COMMIT_SHA}

변경 파일:
${{ steps.cache_changes.outputs.changed_files }}
EOF
)"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
