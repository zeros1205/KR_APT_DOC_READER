name: codex-텔레그램 PDF 수신

# 텔레그램 봇(cloudflare-worker)이 사용자가 채팅에 첨부한 공고문 PDF 를
# 대기 목록(output/notice_pending.json)과 매칭한 뒤 dispatch 하는 워크플로우.
# Worker 는 파일 실물을 다루지 않고 file_id 만 넘긴다 — Worker(Cloudflare
# Workers 무료 플랜)는 요청당 CPU 시간이 10ms 로 제한돼 있어 수 MB 짜리
# PDF 를 base64 인코딩해 GitHub Contents API 로 커밋하는 작업을 감당하지
# 못한다. 반면 이 Actions 러너는 CPU/메모리 제약이 없어 다운로드부터
# 커밋, 이어지는 페이지 생성 트리거까지 전부 여기서 처리한다.

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "텔레그램 file_id"
        required: true
      file_name:
        description: "텔레그램 원본 파일명"
        required: true
      notice_id:
        description: "매칭된 공고번호"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve apt name from cache
        id: resolve
        run: |
          NOTICE_ID="${{ github.event.inputs.notice_id }}"
          CACHE_FILE="output/data_cache/notices/${NOTICE_ID}.json"
          if [ ! -f "$CACHE_FILE" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "reason=공고 캐시(${CACHE_FILE})를 찾을 수 없습니다." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APT_NAME="$(python - "$CACHE_FILE" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8-sig"))
          doc = data.get("document") or {}
          print(data.get("apt_name") or doc.get("apt_name") or "")
          PY
          )"
          if [ -z "$APT_NAME" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "reason=캐시에 단지명이 없습니다." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SAFE_NAME="$(python - "$APT_NAME" <<'PY'
          import re, sys
          print(re.sub(r'[<>:"/\\\\|?*]+', "_", sys.argv[1]).strip())
          PY
          )"

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "apt_name=$APT_NAME" >> "$GITHUB_OUTPUT"
          echo "filename=${NOTICE_ID} ${SAFE_NAME} 입주자모집공고문.pdf" >> "$GITHUB_OUTPUT"

      - name: Download PDF from Telegram
        id: download
        if: steps.resolve.outputs.found == 'true'
        run: |
          FILE_ID="${{ github.event.inputs.file_id }}"
          RESP="$(curl -sS "https://api.telegram.org/bot${TELEGRAM_TOKEN}/getFile?file_id=${FILE_ID}")"

          OK="$(echo "$RESP" | python -c 'import json,sys; print(json.load(sys.stdin).get("ok"))' 2>/dev/null || echo False)"
          if [ "$OK" != "True" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=텔레그램 getFile 실패: $RESP" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILE_PATH="$(echo "$RESP" | python -c 'import json,sys; print(json.load(sys.stdin)["result"]["file_path"])')"
          mkdir -p input/pdfs
          TARGET="input/pdfs/${{ steps.resolve.outputs.filename }}"
          curl -sS -o "$TARGET" "https://api.telegram.org/file/bot${TELEGRAM_TOKEN}/${FILE_PATH}"

          if ! head -c 5 "$TARGET" | grep -q "%PDF-"; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=다운로드한 파일이 PDF 형식이 아닙니다." >> "$GITHUB_OUTPUT"
            rm -f "$TARGET"
            exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "[ingest] saved: $TARGET ($(stat -c%s "$TARGET") bytes)"

      - name: Commit PDF
        id: commit
        if: steps.download.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TARGET="input/pdfs/${{ steps.resolve.outputs.filename }}"
          git add "$TARGET"

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "[ingest] 동일한 PDF 가 이미 커밋되어 있어 변경 없음."
            exit 0
          fi

          git commit -m "chore: PDF 업로드 (텔레그램) - ${{ github.event.inputs.notice_id }}"

          PUSHED=false
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi
            echo "[ingest] push 실패, rebase 후 재시도 ($i/3)"
            git pull --rebase origin main
          done

          if [ "$PUSHED" != "true" ]; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger codex-generate-pages
        id: trigger
        if: steps.download.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS="$(curl -sS -o /tmp/dispatch_resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/codex-generate-pages.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"notice_id\":\"${{ github.event.inputs.notice_id }}\",\"limit\":\"0\"}}")"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "[ingest] dispatch 실패 (HTTP $STATUS): $(cat /tmp/dispatch_resp.txt)"
          fi

      - name: Notify Telegram
        if: always()
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          NOTICE_ID="${{ github.event.inputs.notice_id }}"
          APT_NAME="${{ steps.resolve.outputs.apt_name }}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "${{ steps.resolve.outputs.found }}" != "true" ]; then
            MESSAGE="❌ PDF 매칭 실패 (${NOTICE_ID})
          ${{ steps.resolve.outputs.reason }}
          실행 로그: ${RUN_URL}"
          elif [ "${{ steps.download.outputs.ok }}" != "true" ]; then
            MESSAGE="❌ PDF 다운로드 실패: ${APT_NAME} (${NOTICE_ID})
          ${{ steps.download.outputs.reason }}
          실행 로그: ${RUN_URL}"
          elif [ "${{ steps.trigger.outputs.ok }}" == "true" ]; then
            MESSAGE="✅ PDF 업로드 완료: ${APT_NAME} (${NOTICE_ID})
          페이지 생성 워크플로우를 이어서 실행했습니다. 잠시 후 결과가 도착합니다."
          else
            MESSAGE="⚠️ PDF는 업로드됐지만 페이지 생성 자동 실행에 실패했습니다: ${APT_NAME} (${NOTICE_ID})
          Actions 탭에서 codex-페이지 생성 워크플로우를 수동으로 실행해주세요.
          (저장소 설정 → Actions → General → Workflow permissions 이 \"Read and write\" 인지 확인)
          실행 로그: ${RUN_URL}"
          fi

          RESPONSE="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")"
          echo "Telegram API response: ${RESPONSE}"
