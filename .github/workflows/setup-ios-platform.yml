name: Setup iOS Platform

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Target branch for iOS setup (default: main)"
        required: false
        default: "main"
  pull_request:
    paths:
      - "mobile-app/package.json"
      - "mobile-app/capacitor.config.ts"
      - ".github/workflows/setup-ios-platform.yml"

concurrency:
  group: setup-ios-platform-${{ github.ref }}
  cancel_in_progress: true

env:
  MOBILE_APP_DIR: mobile-app

jobs:
  setup-ios:
    name: Setup iOS Capacitor platform
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install mobile app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build web shell
        working-directory: mobile-app
        run: npm run build

      - name: Check if ios folder exists
        id: check-ios
        working-directory: mobile-app
        run: |
          if [ -d "ios" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Add iOS platform
        if: steps.check-ios.outputs.exists == 'false'
        working-directory: mobile-app
        run: npx cap add ios

      - name: Sync iOS platform
        working-directory: mobile-app
        run: npx cap sync ios

      - name: Install CocoaPods
        if: steps.check-ios.outputs.exists == 'false'
        working-directory: mobile-app/ios/App
        run: pod install --repo-update

      - name: Commit iOS platform
        if: steps.check-ios.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mobile-app/ios/
          git add mobile-app/package-lock.json

          git commit -m $'feat(mobile): setup iOS Capacitor platform\n\nGenerated iOS project structure via npx cap add ios. Configured CocoaPods dependencies. Ready for TestFlight builds via GitHub Actions.'

      - name: Push to main branch
        if: steps.check-ios.outputs.exists == 'false'
        run: |
          git push origin HEAD:main

      - name: Create pull request (if on feature branch)
        if: |
          steps.check-ios.outputs.exists == 'false' &&
          github.ref != 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "iOS: Setup Capacitor platform",
              head: context.ref.replace('refs/heads/', ''),
              base: "main",
              body: `## iOS Platform Setup

Generated iOS project structure:
- ✅ ios/ directory created
- ✅ CocoaPods dependencies installed
- ✅ Xcode project configured
- ✅ Ready for TestFlight builds

**Next steps:**
1. Merge this PR to main
2. All subsequent builds run on GitHub Actions (no local Mac needed)
3. Use \`mobile-app-ios-release.yml\` workflow for TestFlight builds`
            });
            console.log('Pull request created: ' + pr.html_url);

      - name: Show status
        run: |
          echo "=== iOS Platform Setup Status ==="
          echo "iOS folder exists: ${{ steps.check-ios.outputs.exists }}"
          if [ "${{ steps.check-ios.outputs.exists }}" == "true" ]; then
            echo "✅ iOS platform already configured"
            echo "Ready for TestFlight builds!"
          else
            echo "✅ iOS platform setup complete"
            echo "Changes committed to main branch"
          fi
