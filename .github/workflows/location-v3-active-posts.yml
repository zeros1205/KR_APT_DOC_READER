name: codex-입지 분석 v3 → 포스트 일괄 적용 (발표 전/후)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all-active / all-past (이미 패치된 포스트 자동 skip) / targets"
        required: false
        default: "all-active"
        type: choice
        options:
          - "all-active"
          - "all-past"
          - "targets"
      targets:
        description: "mode=targets 일 때 공고 ID 공백으로 구분"
        required: false
        default: ""
      limit:
        description: "최대 처리 건수 (0=제한 없음)"
        required: false
        default: "0"
      dry_run:
        description: "true 면 LLM 호출은 실행되지만(비용 발생) post.html 덮어쓰기·캐시 저장·커밋을 모두 skip"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      checkpoint_every:
        description: "N>0 이면 단지 N건 패치마다 즉시 git push (runner 종료 시 lost 방지). 권장 10"
        required: false
        default: "10"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PATCH_CHECKPOINT_EVERY: ${{ github.event.inputs.checkpoint_every || '10' }}

jobs:
  patch-active-posts:
    runs-on: ubuntu-latest
    # Pro + thinking high + Grounding 단지당 2~5분.
    # all-active(32건)는 240분이면 충분. all-past(160+건)는 GitHub Actions
    # 단일 job 최대 360분(6시간)으로도 부족 — limit 으로 분할 실행 권장.
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git (체크포인트·최종 커밋 공통)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Patch posts (v3 입지 분석 → SECTION 2 교체)
        id: patch
        run: |
          MODE="${{ github.event.inputs.mode }}"
          TARGETS="${{ github.event.inputs.targets }}"
          LIMIT="${{ github.event.inputs.limit }}"
          DRY="${{ github.event.inputs.dry_run }}"

          # Codex P2 — eval 제거. 사용자 입력의 셸 메타문자가 명령으로
          # 해석되지 않도록 인자 배열로 직접 호출.
          ARGS=()
          if [ "$MODE" = "targets" ]; then
            # Codex P1 — targets 모드인데 입력이 비면 fail fast.
            if [ -z "$TARGETS" ]; then
              echo "❌ mode=targets 인데 targets 입력이 비어 있습니다." >&2
              echo "   전체 포스트가 재작성되는 사고를 막기 위해 실행을 중단합니다." >&2
              exit 1
            fi
            ARGS+=(--targets)
            for t in $TARGETS; do
              ARGS+=("$t")
            done
          elif [ "$MODE" = "all-past" ]; then
            ARGS+=(--all-past)
          else
            ARGS+=(--all-active)
          fi
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            ARGS+=(--limit "$LIMIT")
          fi
          if [ "$DRY" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "python tools/patch_posts_location_v3.py ${ARGS[*]}"
          # tee 로 stdout 도 보존해 결과 카운트를 별도 알림 step 에서 사용.
          set +e
          python tools/patch_posts_location_v3.py "${ARGS[@]}" | tee /tmp/patch.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          # 결과 카운트 추출 — 부분 실패라도 commit step 이 동작하도록 노출.
          SUMMARY=$(grep -E "^성공 [0-9]+건 / 실패 [0-9]+건" /tmp/patch.log | tail -1 || echo "성공 0건 / 실패 0건")
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          # 1건이라도 성공이면 main_async 가 0 반환. 전체 실패면 1.
          # patch step 자체는 항상 통과시켜서 fallback Commit step 이 반드시 실행되게.
          exit 0

      - name: Commit patched posts (fallback safety net)
        if: ${{ always() && github.event.inputs.dry_run != 'true' }}
        run: |
          git add output/posts
          if ! git diff --cached --quiet; then
            git commit -m "feat(location-v3): 포스트 입지 분석 일괄 교체 fallback (mode=${{ github.event.inputs.mode }}) [$(date +%Y-%m-%d)]"
            git push
          else
            echo "No post changes (checkpoint 으로 이미 push 됐거나 변경 없음)."
          fi

      - name: Deploy to Cloudflare Pages
        # 봇(GITHUB_TOKEN) 푸시는 cloudflare-pages-auto-deploy 의 push 트리거를
        # 발동시키지 않으므로(GitHub 정책), v3 재패치 결과가 라이브에 반영되지
        # 않던 갭을 막기 위해 여기서 직접 배포한다. codex-generate-pages 와 동일 방식.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          npx --yes wrangler@3.90.0 pages deploy output \
            --project-name kr-apt-doc-reader \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify Telegram
        if: always()
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets 미설정 — 알림 생략"
            exit 0
          fi
          KST="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          SUMMARY="${{ steps.patch.outputs.summary }}"
          PATCH_EXIT="${{ steps.patch.outputs.exit_code }}"
          ICON="✅"
          if [ "${{ job.status }}" != "success" ]; then
            ICON="❌"
          elif [ "$PATCH_EXIT" != "0" ]; then
            ICON="⚠️"
          fi
          MESSAGE="${ICON} 입지 분석 v3 일괄 교체 (${KST})
          모드: ${{ github.event.inputs.mode }} · dry_run=${{ github.event.inputs.dry_run }} · limit=${{ github.event.inputs.limit }} · checkpoint=${PATCH_CHECKPOINT_EVERY}
          결과: ${SUMMARY:-N/A}
          실행 로그: ${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" > /dev/null
