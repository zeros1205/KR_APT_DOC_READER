name: codex-오래된 PDF 정리

# 발행 완료된(processed_notices.json 에 있는) 공고의 원본 PDF 중, 업로드 후
# 7일이 지난 파일을 input/pdfs 에서 삭제한다. 아직 페이지 생성이 안 된
# 공고의 PDF는 절대 건드리지 않는다 — tools/cleanup_old_pdfs.py 참고.

# [운영 종료 2026-09-01] 자동 트리거 제거 — 수동 실행(workflow_dispatch)만 남김.
# 되살리려면 이 커밋을 revert 하면 원래 트리거가 복구된다.
on:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        # PDF 별 "최초 업로드 커밋" 날짜를 알아내려면 전체 이력이 필요하다.
        # 다른 워크플로우처럼 기본값(shallow, depth=1)을 쓰면 git log 가 항상
        # 최신 커밋 1개만 보여줘 파일이 언제 추가됐는지 구분할 수 없다.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Delete PDFs older than 7 days (already published only)
        id: cleanup
        run: |
          python tools/cleanup_old_pdfs.py 2>&1 | tee /tmp/cleanup_log.txt
          COUNT="$(grep -o 'DELETED_COUNT=[0-9]*' /tmp/cleanup_log.txt | tail -1 | cut -d= -f2)"
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: Commit deletions
        if: steps.cleanup.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add input/pdfs
          if ! git diff --cached --quiet; then
            git commit -m "chore: 오래된 PDF 정리 (7일 경과 · 발행 완료 공고) [$(date +%Y-%m-%d)]"
            git push
          else
            echo "No PDF deletions to commit."
          fi

      - name: Notify Telegram
        if: always()
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Skipping notification."
            exit 0
          fi

          COUNT="${{ steps.cleanup.outputs.count || '0' }}"
          MESSAGE="🧹 PDF 정리: ${COUNT}건 삭제 (7일 경과 · 발행 완료 공고만 대상)"

          RESPONSE="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")"
          echo "Telegram API response: ${RESPONSE}"
