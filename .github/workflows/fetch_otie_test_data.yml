name: 오티에르 반포 테스트 데이터 수집

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-otie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: .env 파일 생성 (GitHub Secrets → .env)
        run: |
          cat <<EOF > .env
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          PUBLIC_DATA_API_KEY=${{ secrets.PUBLIC_DATA_API_KEY }}
          UNSPLASH_ACCESS_KEY=${{ secrets.UNSPLASH_ACCESS_KEY }}
          EOF

      - name: 오티에르 반포 데이터 수집
        run: python fetch_otie_test_data.py

      - name: 데이터 검증
        run: |
          if [ -f "output/test_data/otie_banpo/data.json" ]; then
            echo "✅ 테스트 데이터 저장 성공"
            echo "## 오티에르 반포 테스트 데이터 수집 완료" >> "$GITHUB_STEP_SUMMARY"
            ls -lh output/test_data/otie_banpo/data.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 테스트 데이터 저장 실패"
            exit 1
          fi

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/test_data/
          if ! git diff --cached --quiet; then
            git commit -m "test: save otie-banpo test data from public API"
            git push origin main
          else
            echo "커밋할 변경사항 없음"
          fi
