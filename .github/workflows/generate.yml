name: 포스트 생성

on:
  workflow_dispatch:
    inputs:
      generate_limit:
        description: '생성 최대 건수 (0=무제한)'
        default: '3'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 가상환경 캐시
        uses: actions/cache@v4
        id: venv-cache
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.11-${{ hashFiles('requirements.txt') }}

      - name: ChromaDB 모델 캐싱
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-models-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            chroma-models-

      - name: 의존성 설치
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: 가상환경 PATH 등록
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: 환경 변수 설정
        run: |
          cat > .env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          PUBLIC_DATA_API_KEY=${{ secrets.PUBLIC_DATA_API_KEY }}
          EOF

      - name: 환경 검증
        run: |
          python -c "
          import os
          from dotenv import load_dotenv
          load_dotenv()

          gemini_key = os.getenv('GEMINI_API_KEY', '')
          if gemini_key:
            print(f'✓ GEMINI_API_KEY: {gemini_key[:10]}...{gemini_key[-5:]} (길이: {len(gemini_key)})')
          else:
            print('❌ GEMINI_API_KEY: 설정되지 않음')
            exit(1)

          from pipeline.config import LLM_EXTRACT_MODEL
          print(f'✓ LLM_EXTRACT_MODEL: {LLM_EXTRACT_MODEL}')
          "

      - name: 생성 전 스냅샷
        run: |
          if [ -f "output/processed_notices.json" ]; then
            cp output/processed_notices.json /tmp/processed_before.json
          else
            echo "[]" > /tmp/processed_before.json
          fi

      - name: 포스트 생성
        run: |
          LIMIT=${{ github.event.inputs.generate_limit || '3' }}
          if [ "$LIMIT" = "0" ]; then
            python generate_posts_from_cache.py
          else
            python generate_posts_from_cache.py --limit $LIMIT
          fi

      - name: 생성 결과 확인
        if: always()
        run: |
          echo "=== 포스트 생성 결과 ==="
          if [ -d "output/posts" ]; then
            COUNT=$(find output/posts -name "post.html" | wc -l)
            echo "📝 전체 포스팅: $COUNT개"
          fi
          if [ -f "output/processed_notices.json" ]; then
            PROCESSED=$(python3 -c "import json; d=json.load(open('output/processed_notices.json')); print(len(d))")
            echo "✅ 처리 완료 누적: $PROCESSED개"
          fi
          echo ""
          echo "=== 이번 실행에서 새로 생성된 포스트 ==="
          python3 - <<'PYEOF'
          import json
          from pathlib import Path
          before = set(json.load(open('/tmp/processed_before.json')))
          after  = set(json.load(open('output/processed_notices.json'))) if Path('output/processed_notices.json').exists() else set()
          new_ids = after - before
          if not new_ids:
              print("  (신규 없음)")
          else:
              metas = list(Path('output/posts').glob('*/post_meta.json'))
              for nid in sorted(new_ids):
                  name = nid
                  for m in metas:
                      try:
                          d = json.loads(m.read_text())
                          if str(d.get('notice_id','')) == str(nid) or str(d.get('pblancNo','')) == str(nid):
                              name = d.get('apt_name', nid)
                              break
                      except Exception:
                          pass
                  print(f"  ✨ [{nid}] {name}")
          PYEOF

      - name: 커밋 및 푸시
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash origin main

          git add -f output/posts/ output/index.html output/sitemap.xml output/robots.txt 2>/dev/null || true
          git add output/processed_notices.json output/manifest.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "chore: 분양공고 포스팅 생성 [$(date +%Y-%m-%d)]"
            git push -u origin main
          else
            echo "신규 변경사항 없음 — 커밋 스킵"
          fi

      - name: 아티팩트 백업
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posts-backup-${{ github.run_id }}
          path: output/posts/
          retention-days: 7
          if-no-files-found: ignore
