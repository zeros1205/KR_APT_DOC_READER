name: codex-입지 분석 A/B 테스트

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "공고 ID 공백으로 구분 (비우면 베이스라인 4단지)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  location-ab:
    runs-on: ubuntu-latest
    # gemini-3.1-pro-preview + thinking_level=high + Grounding 조합은 단지당
    # 2~5분이 일반적이라 4단지 처리에 20분으론 빠듯. 여유롭게 60분으로 확장.
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run A/B (v1 production vs v2 experiment)
        run: |
          TARGETS="${{ github.event.inputs.targets }}"
          if [ -z "$TARGETS" ]; then
            python tools/run_location_ab.py --baseline
          else
            python tools/run_location_ab.py --targets $TARGETS
          fi

      - name: Build comparison report
        run: python tools/build_location_ab_report.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seo_audit/location_ab
          if ! git diff --cached --quiet; then
            git commit -m "chore(location-ab): A/B 결과 [$(date +%Y-%m-%d)]"
            git push
          else
            echo "No A/B output changes."
          fi

      - name: Notify Telegram
        if: always()
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets 미설정 — 알림 생략"
            exit 0
          fi
          KST="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          LATEST="$(ls -1t seo_audit/location_ab/*/ab_report.md 2>/dev/null | head -n 1 || true)"
          if [ -n "$LATEST" ] && [ "${{ job.status }}" = "success" ]; then
            BRANCH="${GITHUB_REF_NAME:-main}"
            REL="${LATEST#./}"
            MD_URL="${REPO_URL}/blob/${BRANCH}/${REL}"
            MESSAGE="✅ 입지 분석 A/B 결과 (${KST})

          📊 비교 리포트:
          ${MD_URL}

          v1(production) vs v2(experiment) 4단지 비교가 포함되어 있습니다."
          else
            MESSAGE="❌ 입지 분석 A/B 실행 실패 (${KST})
          실행 로그: ${REPO_URL}/actions/runs/${GITHUB_RUN_ID}"
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" > /dev/null
